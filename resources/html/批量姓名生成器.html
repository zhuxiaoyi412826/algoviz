<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量姓名生成器</title>
<style>
    :root {
        --bg-primary: #f5f7fa;
        --bg-card: #ffffff;
        --bg-soft: #eef2f7;
        --text-primary: #1f2937;
        --text-secondary: #6b7280;
        --accent: #4f7cff;
        --accent-hover: #3a63d8;
        --border: #e5e7eb;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        padding: 24px;
        line-height: 1.6;
    }
    .app { max-width: 1200px; margin: 0 auto; }
    .app-header { text-align: center; margin-bottom: 24px; }
    .app-header h1 { font-size: 26px; color: var(--text-primary); font-weight: 600; }
    .app-header p { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }
    .main { display: grid; grid-template-columns: 400px 1fr; gap: 20px; }
    .card {
        background: var(--bg-card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
    }
    .card-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
        color: var(--text-primary);
    }
    .form-group { margin-bottom: 16px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
        display: block;
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 6px;
        font-weight: 500;
    }
    .form-label .hint { font-size: 12px; color: #9aa3af; font-weight: normal; }
    .form-input, .form-select, .form-textarea {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 14px;
        background: #fff;
        color: var(--text-primary);
        transition: border-color 0.15s, box-shadow 0.15s;
        font-family: inherit;
    }
    .form-textarea {
        min-height: 70px;
        resize: vertical;
        line-height: 1.7;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.12);
    }
    .radio-row, .check-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .radio-item, .check-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        cursor: pointer;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        transition: all 0.15s;
        user-select: none;
    }
    .radio-item:hover, .check-item:hover { border-color: var(--accent); background: var(--bg-soft); }
    .radio-item input, .check-item input { cursor: pointer; accent-color: var(--accent); margin: 0; }
    .radio-item.active, .check-item.active {
        border-color: var(--accent);
        background: rgba(79, 124, 255, 0.08);
        color: var(--accent);
    }
    /* 可折叠区域 */
    .collapsible {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: #fafbfc;
    }
    .collapsible-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        cursor: pointer;
        background: #fff;
        font-size: 14px;
        font-weight: 500;
        user-select: none;
    }
    .collapsible-header:hover { background: var(--bg-soft); }
    .collapsible-header .arrow {
        transition: transform 0.2s;
        font-size: 12px;
        color: var(--text-secondary);
    }
    .collapsible.open .collapsible-header .arrow { transform: rotate(90deg); }
    .collapsible-body {
        padding: 14px;
        display: none;
    }
    .collapsible.open .collapsible-body { display: block; }
    .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
    }
    .btn {
        flex: 1;
        padding: 9px 14px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
        font-weight: 500;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-soft); color: var(--text-primary); }
    .btn-secondary:hover { background: #dde3ec; }
    .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    .result-stat { font-size: 13px; color: var(--text-secondary); }
    .result-stat strong { color: var(--accent); font-weight: 600; }
    .result-box {
        width: 100%;
        height: 540px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fafbfc;
        font-family: "Consolas", "Microsoft YaHei", monospace;
        font-size: 14px;
        line-height: 1.9;
        resize: vertical;
        color: var(--text-primary);
        white-space: pre;
        overflow: auto;
    }
    .result-box:focus { outline: none; border-color: var(--accent); }
    .toast {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: rgba(33, 33, 33, 0.92);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        z-index: 1000;
        transition: transform 0.3s ease;
        pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    @media (max-width: 860px) {
        .main { grid-template-columns: 1fr; }
        .result-box { height: 360px; }
    }
</style>
</head>
<body>
<div class="app">
    <header class="app-header">
        <h1>批量姓名生成器</h1>
        <p>自定义姓氏 · 名字长度 · 性别风格 · 年代风格 · 自定义字库</p>
    </header>
    <div class="main">
        <!-- 左侧:控制面板 -->
        <section class="card">
            <div class="card-title">生成参数</div>

            <!-- 姓氏来源 -->
            <div class="form-group">
                <label class="form-label">姓氏来源</label>
                <div class="radio-row" id="surnameSource">
                    <label class="radio-item active">
                        <input type="radio" name="surnameSource" value="fixed" checked>
                        <span>指定姓氏</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="surnameSource" value="random">
                        <span>随机单姓</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="surnameSource" value="compound">
                        <span>随机复姓</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="surnameSource" value="list">
                        <span>列表随机</span>
                    </label>
                </div>
            </div>

            <!-- 姓氏输入 -->
            <div class="form-group">
                <label class="form-label">
                    姓氏输入 <span class="hint">(多个用逗号 / 空格分隔,如:张 王,欧阳)</span>
                </label>
                <input type="text" class="form-input" id="surnameInput" placeholder="如:张" value="张">
            </div>

            <!-- 名字长度 -->
            <div class="form-group">
                <label class="form-label">名字长度</label>
                <div class="check-row" id="nameLength">
                    <label class="check-item active">
                        <input type="checkbox" value="1" checked>
                        <span>单字名</span>
                    </label>
                    <label class="check-item active">
                        <input type="checkbox" value="2" checked>
                        <span>双字名</span>
                    </label>
                    <label class="check-item">
                        <input type="checkbox" value="3">
                        <span>三字名</span>
                    </label>
                </div>
            </div>

            <!-- 性别风格 -->
            <div class="form-group">
                <label class="form-label">性别风格</label>
                <div class="radio-row" id="genderStyle">
                    <label class="radio-item active">
                        <input type="radio" name="genderStyle" value="mixed" checked>
                        <span>混合</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="genderStyle" value="male">
                        <span>偏男</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="genderStyle" value="female">
                        <span>偏女</span>
                    </label>
                </div>
            </div>

            <!-- 年代风格 -->
            <div class="form-group">
                <label class="form-label">
                    年代风格 <span class="hint">(影响用字风格)</span>
                </label>
                <div class="radio-row" id="eraStyle">
                    <label class="radio-item active">
                        <input type="radio" name="eraStyle" value="none" checked>
                        <span>不限</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="eraStyle" value="era50">
                        <span>50后</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="eraStyle" value="era70">
                        <span>70后</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="eraStyle" value="era90">
                        <span>90后</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="eraStyle" value="era00">
                        <span>00后</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="eraStyle" value="era10">
                        <span>10后</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="eraStyle" value="era20">
                        <span>20后</span>
                    </label>
                </div>
            </div>

            <!-- 自定义字库(可折叠) -->
            <div class="form-group">
                <div class="collapsible" id="customCharBox">
                    <div class="collapsible-header">
                        <span>自定义用字库(高级)</span>
                        <span class="arrow">▶</span>
                    </div>
                    <div class="collapsible-body">
                        <div class="form-group">
                            <label class="form-label">使用方式</label>
                            <div class="radio-row" id="customMode">
                                <label class="radio-item active">
                                    <input type="radio" name="customMode" value="none" checked>
                                    <span>不使用</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="customMode" value="merge">
                                    <span>扩充</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="customMode" value="replace">
                                    <span>替换</span>
                                </label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">
                                自定义用字 <span class="hint">(直接输入汉字,无需分隔符)</span>
                            </label>
                            <textarea class="form-textarea" id="customChars" placeholder="如:岚璇玹珩瑾瑜沐辰烁屿"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">字库属性</label>
                            <div class="radio-row" id="customGender">
                                <label class="radio-item active">
                                    <input type="radio" name="customGender" value="neutral" checked>
                                    <span>中性</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="customGender" value="male">
                                    <span>偏男</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="customGender" value="female">
                                    <span>偏女</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 生成数量 -->
            <div class="form-group">
                <label class="form-label">生成数量</label>
                <input type="number" class="form-input" id="count" value="50" min="1" max="10000000">
            </div>

            <!-- 其他选项 -->
            <div class="form-group">
                <label class="form-label">其他选项</label>
                <div class="check-row">
                    <label class="check-item">
                        <input type="checkbox" id="allowDup">
                        <span>允许重复</span>
                    </label>
                    <label class="check-item">
                        <input type="checkbox" id="addNumber" checked>
                        <span>带序号</span>
                    </label>
                    <label class="check-item">
                        <input type="checkbox" id="showPinyin">
                        <span>附拼音</span>
                    </label>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="btn-group">
                <button class="btn btn-primary" id="btnGenerate">生 成</button>
                <button class="btn btn-secondary" id="btnCopy">复 制</button>
                <button class="btn btn-secondary" id="btnExport">导 出</button>
                <button class="btn btn-secondary" id="btnClear">清 空</button>
            </div>
        </section>

        <!-- 右侧:结果区 -->
        <section class="card">
            <div class="result-header">
                <div class="card-title" style="margin:0; padding:0; border:none;">生成结果</div>
                <div class="result-stat">共 <strong id="statCount">0</strong> 个</div>
            </div>
            <textarea class="result-box" id="resultBox" readonly placeholder="点击「生成」按钮,结果将显示在此处..."></textarea>
        </section>
    </div>
</div>

<div class="toast" id="toast"></div>

/* ============================================================
 * 模块 2:核心生成器 / Name Generator Core
 * ============================================================ */
const NameGenerator = {

    /** 从数组随机取一个元素 */
    pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    },

    /** 解析姓氏字符串(支持空格/中英文逗号分隔) */
    parseSurnames(text) {
        if (!text) return [];
        return text.split(/[\s,，、;；]+/).map(s => s.trim()).filter(s => s.length > 0);
    },

    /** 解析自定义用字(直接拆分为单字数组) */
    parseCustomChars(text) {
        if (!text) return [];
        // 移除所有空白和标点,按字符拆分
        return text.replace(/[\s,，、;；·\-_.]+/g, "").split("").filter(c => c.trim().length > 0);
    },

    /**
     * 根据性别 + 年代 + 自定义配置,构建名用字池
     * @param {string} gender - mixed / male / female
     * @param {string} era - none / era50 / era70 / ...
     * @param {Object} custom - { mode: none|merge|replace, chars: string[], gender: neutral|male|female }
     * @returns {{male: string[], female: string[], neutral: string[]}}
     */
    buildCharPool(gender, era, custom) {
        let malePool, femalePool, neutralPool;

        if (era !== "none" && NameData.eraChars[era]) {
            // 年代模式:使用年代字库
            const eraData = NameData.eraChars[era];
            malePool = eraData.male.slice();
            femalePool = eraData.female.slice();
            neutralPool = [...eraData.male, ...eraData.female]; // 中性 = 年代男女混合
        } else {
            // 默认字库
            malePool = NameData.maleChars.slice();
            femalePool = NameData.femaleChars.slice();
            neutralPool = NameData.neutralChars.slice();
        }

        // 应用自定义字库
        if (custom.mode !== "none" && custom.chars.length > 0) {
            if (custom.mode === "replace") {
                // 替换:完全只用自定义字,所有池统一为自定义字
                malePool = custom.chars.slice();
                femalePool = custom.chars.slice();
                neutralPool = custom.chars.slice();
            } else if (custom.mode === "merge") {
                // 扩充:按性别属性加入对应池
                if (custom.gender === "male") {
                    malePool = [...malePool, ...custom.chars];
                } else if (custom.gender === "female") {
                    femalePool = [...femalePool, ...custom.chars];
                } else {
                    neutralPool = [...neutralPool, ...custom.chars];
                    malePool = [...malePool, ...custom.chars];
                    femalePool = [...femalePool, ...custom.chars];
                }
            }
        }

        return { male: malePool, female: femalePool, neutral: neutralPool };
    },

    /** 根据性别风格选择字池 */
    selectPoolByGender(pools, gender) {
        if (gender === "male") {
            return [...pools.male, ...pools.neutral];
        }
        if (gender === "female") {
            return [...pools.female, ...pools.neutral];
        }
        return [...pools.male, ...pools.female, ...pools.neutral];
    },

    /** 生成单个名字(不含姓) */
    generateGivenName(length, pool) {
        let name = "";
        for (let i = 0; i < length; i++) {
            name += this.pick(pool);
        }
        return name;
    },

    /** 批量生成 */
    generateBatch(options) {
        const {
            surnameSource,
            surnames = [],
            lengths = [1, 2],
            gender = "mixed",
            era = "none",
            custom = { mode: "none", chars: [], gender: "neutral" },
            count = 50,
            allowDup = false
        } = options;

        // 构建姓氏池
        let surnamePool = [];
        if (surnameSource === "fixed") {
            surnamePool = surnames.slice(0, 1);
        } else if (surnameSource === "list") {
            surnamePool = surnames.slice();
        } else if (surnameSource === "random") {
            surnamePool = NameData.surnames.slice();
        } else if (surnameSource === "compound") {
            surnamePool = NameData.compoundSurnames.slice();
        }
        if (surnamePool.length === 0) {
            throw new Error("未提供有效姓氏,请检查输入");
        }
        if (lengths.length === 0) {
            throw new Error("请至少选择一种名字长度");
        }

        // 构建名用字池
        const pools = this.buildCharPool(gender, era, custom);
        const charPool = this.selectPoolByGender(pools, gender);
        if (charPool.length === 0) {
            throw new Error("用字池为空,请检查自定义字库配置");
        }

        const result = [];
        const seen = new Set();
        const maxAttempts = count * 50;
        let attempts = 0;

        while (result.length < count && attempts < maxAttempts) {
            attempts++;
            const surname = this.pick(surnamePool);
            const len = this.pick(lengths);
            const given = this.generateGivenName(len, charPool);
            const fullName = surname + given;
            if (!allowDup) {
                if (seen.has(fullName)) continue;
                seen.add(fullName);
            }
            result.push(fullName);
        }
        return result;
    },

    /** 查询姓名拼音(优先匹配复姓,再匹配单姓,剩余逐字) */
    getPinyin(text) {
        if (!text) return "";
        const compoundSet = new Set(NameData.compoundSurnames);
        let idx = 0;
        let parts = [];
        // 1. 先尝试匹配复姓(前 2 字)
        if (text.length >= 2 && compoundSet.has(text.slice(0, 2))) {
            parts.push(NameData.pinyinMap[text.slice(0, 2)] || "?");
            idx = 2;
        } else if (NameData.pinyinMap[text.slice(0, 1)]) {
            // 2. 单姓
            parts.push(NameData.pinyinMap[text.slice(0, 1)]);
            idx = 1;
        } else {
            // 3. 首字无拼音,逐字处理
            idx = 0;
        }
        // 4. 剩余字符逐字查询
        for (let i = idx; i < text.length; i++) {
            parts.push(NameData.pinyinMap[text[i]] || "?");
        }
        return parts.join(" ");
    }
};

/* ============================================================
 * 模块 3:UI 控制器 / UI Controller
 * ============================================================ */
const UI = {
    els: {},

    init() {
        this.els = {
            surnameInput: document.getElementById("surnameInput"),
            count: document.getElementById("count"),
            allowDup: document.getElementById("allowDup"),
            addNumber: document.getElementById("addNumber"),
            showPinyin: document.getElementById("showPinyin"),
            customChars: document.getElementById("customChars"),
            btnGenerate: document.getElementById("btnGenerate"),
            btnCopy: document.getElementById("btnCopy"),
            btnExport: document.getElementById("btnExport"),
            btnClear: document.getElementById("btnClear"),
            resultBox: document.getElementById("resultBox"),
            statCount: document.getElementById("statCount"),
            toast: document.getElementById("toast"),
            customCharBox: document.getElementById("customCharBox")
        };

        this.bindRadioStyle("surnameSource", (val) => this.updateSurnamePlaceholder(val));
        this.bindCheckboxStyle("nameLength");
        this.bindRadioStyle("genderStyle");
        this.bindRadioStyle("eraStyle");
        this.bindRadioStyle("customMode");
        this.bindRadioStyle("customGender");

        // 可折叠区域
        this.els.customCharBox.querySelector(".collapsible-header").addEventListener("click", () => {
            this.els.customCharBox.classList.toggle("open");
        });

        this.els.btnGenerate.addEventListener("click", () => this.onGenerate());
        this.els.btnCopy.addEventListener("click", () => this.onCopy());
        this.els.btnExport.addEventListener("click", () => this.onExport());
        this.els.btnClear.addEventListener("click", () => this.onClear());
    },

    /** 单选组 active 样式 + change 回调 */
    bindRadioStyle(containerId, onChange) {
        const container = document.getElementById(containerId);
        const items = container.querySelectorAll(".radio-item");
        items.forEach(item => {
            const input = item.querySelector("input");
            input.addEventListener("change", () => {
                items.forEach(i => i.classList.remove("active"));
                item.classList.add("active");
                if (onChange) onChange(input.value);
            });
        });
    },

    /** 复选组 active 样式 */
    bindCheckboxStyle(containerId) {
        const container = document.getElementById(containerId);
        const items = container.querySelectorAll(".check-item");
        items.forEach(item => {
            const input = item.querySelector("input");
            input.addEventListener("change", () => {
                item.classList.toggle("active", input.checked);
            });
        });
    },

    updateSurnamePlaceholder(source) {
        const map = {
            fixed: "如:张",
            random: "随机单姓模式下留空即可",
            compound: "随机复姓模式下留空即可",
            list: "如:张 王,欧阳 司马"
        };
        this.els.surnameInput.placeholder = map[source] || "";
        if (source === "random" || source === "compound") {
            this.els.surnameInput.value = "";
        }
    },

    /** 收集表单参数 */
    getOptions() {
        const source = document.querySelector('input[name="surnameSource"]:checked').value;
        const surnames = NameGenerator.parseSurnames(this.els.surnameInput.value);
        const lengths = Array.from(document.querySelectorAll('#nameLength input:checked'))
            .map(cb => parseInt(cb.value, 10));
        const gender = document.querySelector('input[name="genderStyle"]:checked').value;
        const era = document.querySelector('input[name="eraStyle"]:checked').value;
        const customMode = document.querySelector('input[name="customMode"]:checked').value;
        const customGender = document.querySelector('input[name="customGender"]:checked').value;
        const customChars = NameGenerator.parseCustomChars(this.els.customChars.value);
        const count = Math.max(1, Math.min(10000000, parseInt(this.els.count.value, 10) || 50));
        return {
            source, surnames, lengths, gender, era,
            custom: { mode: customMode, chars: customChars, gender: customGender },
            count,
            allowDup: this.els.allowDup.checked,
            addNumber: this.els.addNumber.checked,
            showPinyin: this.els.showPinyin.checked
        };
    },

    onGenerate() {
        try {
            const opts = this.getOptions();
            const names = NameGenerator.generateBatch({
                surnameSource: opts.source,
                surnames: opts.surnames,
                lengths: opts.lengths,
                gender: opts.gender,
                era: opts.era,
                custom: opts.custom,
                count: opts.count,
                allowDup: opts.allowDup
            });

            const lines = names.map((n, i) => {
                let line = opts.addNumber
                    ? (i + 1).toString().padStart(4, "0") + ".\t" + n
                    : n;
                if (opts.showPinyin) {
                    line += "  (" + NameGenerator.getPinyin(n) + ")";
                }
                return line;
            });

            this.els.resultBox.value = lines.join("\n");
            this.els.statCount.textContent = names.length;

            if (names.length < opts.count) {
                this.toast("候选空间不足,仅生成 " + names.length + " 个(可勾选「允许重复」)");
            } else {
                this.toast("已生成 " + names.length + " 个姓名");
            }
        } catch (e) {
            this.toast("错误:" + e.message);
        }
    },

    async onCopy() {
        const text = this.els.resultBox.value;
        if (!text) { this.toast("暂无结果可复制"); return; }
        try {
            await navigator.clipboard.writeText(text);
            this.toast("已复制到剪贴板");
        } catch (e) {
            this.els.resultBox.select();
            document.execCommand("copy");
            this.toast("已复制到剪贴板");
        }
    },

    onExport() {
        const text = this.els.resultBox.value;
        if (!text) { this.toast("暂无结果可导出"); return; }
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
        a.href = url;
        a.download = "姓名列表_" + ts + ".txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        this.toast("已导出 txt 文件");
    },

    onClear() {
        this.els.resultBox.value = "";
        this.els.statCount.textContent = "0";
        this.toast("已清空");
    },

    toast(msg) {
        const t = this.els.toast;
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
    }
};

document.addEventListener("DOMContentLoaded", () => {
    UI.init();
});
</script>
