# =====================================================================
#  AlgoVize Fluentd 配置 - 采集 Java + Python 日志到 Elasticsearch
# =====================================================================
#  启动方式：
#    fluentd -c fluentd.conf
#    或
#    td-agent -c fluentd.conf
#
#  依赖插件：
#    fluent-plugin-elasticsearch (4.3.3)
#    td-agent-plugin-escleanup (可选，自动清理过期索引)
#
#  日志来源：
#    1. Spring Boot 后端日志  D:/rizi/*.log
#    2. Python 向量服务日志   logs/app.log
#
#  目标：Elasticsearch 7.12.1
#  索引：algoviz-logs-YYYY.MM.DD
# =====================================================================


# ==================== 系统配置 ====================
<system>
  # 日志级别：trace/debug/info/warn/error/fatal
  log_level info

  # 工作进程数
  workers 1

  # 根目录
  root_dir C:/fluentd

  # HTTP 监控端口（健康检查 /api/plugins）
  <transport>
    port 24220
  </transport>
</system>


# ==================== Source 1: Spring Boot 后端日志 ====================
# 采集 D:/rizi 目录下的 info.log 和 error.log
<source>
  @type tail

  # 日志文件路径（支持通配符）
  path D:/rizi/info.log, D:/rizi/error.log, D:/rizi/info-*.log, D:/rizi/error-*.log

  # 标签路由
  tag algoviz.backend

  # 注意：不要设置 encoding UTF-8，tail 插件读取 UTF-8 文件时
  #       设置 encoding 会触发二次转码，导致中文变成 \uFFFD 乱码

  # 从文件末尾开始读取（不读取历史日志）
  pos_file C:/fluentd/pos/java.pos

  # 每次读取的行数
  read_lines_limit 1000

  # 读取间隔（秒）
  refresh_interval 5

  # 多行日志处理：Java 堆栈以日期开头，非日期行合并到前一行
  <parse>
    @type multiline
    # 以日期开头的行作为新日志的开始
    format_firstline /^\d{4}-\d{2}-\d{2}/
    # Java logback 格式：2026-08-17 17:09:17.123 [trace_id] [thread] LEVEL logger - message
    # TraceId 允许任意非 ] 字符（兼容外部传入的 test-trace-xxx、UUID 等）
    format1 /^(?<logtime>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) \[(?<trace_id>[^\]]+)\] \[(?<thread>[^\]]+)\] (?<level>[A-Z]+)\s+(?<logger>[^\s]+) - (?<message>.*)$/
  </parse>

  # 添加元数据字段
  add_record_path {
    "service": "algoviz-backend",
    "language": "java",
    "component": "spring-boot"
  }
</source>


# ==================== Source 2: Python 向量服务日志 ====================
# 采集 logs/app.log
<source>
  @type tail

  # 日志文件路径（与 Spring Boot 统一在 D:/rizi 目录下）
  path D:/rizi/python-app.log

  # 标签路由
  tag algoviz.vector

  # 位置记录文件
  pos_file C:/fluentd/pos/python.pos

  read_lines_limit 1000
  refresh_interval 5

  # 多行日志处理：Python 堆栈
  <parse>
    @type multiline
    format_firstline /^\d{4}-\d{2}-\d{2}/
    # Python 日志格式（trace_middleware.py 的 datefmt=%Y-%m-%d %H:%M:%S，无毫秒）：
    # 2026-08-17 17:09:17 [test-trace-1786957755] [INFO] algoviz - 收到搜索请求
    # TraceId 允许任意非 ] 字符（外部传入的可能是 test-trace-xxx、UUID 等）
    format1 /^(?<logtime>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \[(?<trace_id>[^\]]+)\] \[(?<level>[A-Z]+)\] (?<logger>[^\s]+) - (?<message>.*)$/
  </parse>

  add_record_path {
    "service": "algoviz-vector",
    "language": "python",
    "component": "fastapi"
  }
</source>


# ==================== Source 3: Fluentd 健康检查 ====================
<source>
  @type http
  port 24220
  bind 0.0.0.0
  tag fluentd.health
</source>


# ==================== Filter: 统一添加字段 ====================
# 为 Java 后端日志添加标识字段
<filter algoviz.backend>
  @type record_transformer
  <record>
    service    algoviz-backend
    language   java
    component  spring-boot
    hostname   "#{Socket.gethostname rescue 'unknown'}"
  </record>
</filter>

# 为 Python 向量服务日志添加标识字段
<filter algoviz.vector>
  @type record_transformer
  <record>
    service    algoviz-vector
    language   python
    component  fastapi
    hostname   "#{Socket.gethostname rescue 'unknown'}"
  </record>
</filter>


# ==================== Filter: 提取 TraceId 到顶层字段 ====================
# 如果正则解析成功，trace_id 已经在记录中
# 这里做一层保险：确保 @timestamp 字段存在
<filter algoviz.**>
  @type record_transformer
  enable_ruby true
  <record>
    # 将 logtime 转为 ES 的 @timestamp 格式
    @timestamp ${record["logtime"]}
  </record>
</filter>


# ==================== Match: 输出到 Elasticsearch ====================
<match algoviz.**>
  @type elasticsearch

  # Elasticsearch 地址
  host localhost
  port 9200
  scheme http

  # 认证（如果 ES 设置了密码）
  # user elastic
  # password changeme

  # 索引名称（按天滚动）
  logstash_format true
  logstash_prefix algoviz-logs
  logstash_dateformat %Y.%m.%d

  # 索引模板（指定项目内实际路径，避免找不到文件）
  template_name algoviz-logs
  template_file d:/daima/XiangMu/算法数据结构可视化/AlgoVize/Agent/know-retrieval/templates/algoviz-template.json

  # 覆盖已存在的模板
  template_overwrite true

  # 批处理大小
  flush_size 500

  # 刷新间隔（秒）
  flush_interval 5s

  # 重试机制
  resurrect_after 5s

  # 请求超时
  request_timeout 60s

  # 重连次数
  reload_connections false

  # 异步写入（不阻塞采集）
  async true
  async_conn_retry_timeout 10s

  # 缓冲区配置（防止 ES 宕机时丢日志）
  <buffer>
    @type file
    path C:/fluentd/buffer/algoviz
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 16MB
    total_limit_size 5GB
    retry_wait 5s
    retry_max_interval 30s
    retry_max_times 10
    overflow_action block
  </buffer>
</match>


# ==================== Match: 健康检查日志直接丢弃 ====================
<match fluentd.health>
  @type null
</match>


# ==================== Match: 兜底 ====================
# 未匹配到任何 tag 的日志（调试用，生产可关闭）
<match **>
  @type null
</match>
