# ============================================================
# Dependabot：仅维护【有害的安全漏洞】
#  - 定期版本升级（Version updates）已禁用（open-pull-requests-limit: 0）
#  - 安全漏洞修复 PR 由仓库 Settings → Code security → Dependabot security updates 控制：
#     发现存在 CVE 的依赖时自动开 PR，标题为固定格式 "Bump <包名> from <旧版> to <新版>"（简短）
#  - 每月最后一个周六 18:00（北京时间）的定时漏洞审核，见 security-scan.yml（Trivy + Code Scanning）
# 说明：本文件只在默认分支生效；漏洞告警开关在仓库设置里开启
# ============================================================
version: 2
updates:
  # 前端依赖（npm）：仅安全更新，不升版本
  - package-ecosystem: "npm"
    directory: "/houtai"
    open-pull-requests-limit: 0

  # 后端依赖（Maven）：仅安全更新，不升版本
  - package-ecosystem: "maven"
    directory: "/houduan"
    open-pull-requests-limit: 0

  # GitHub Actions 依赖：仅安全更新，不升版本
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
