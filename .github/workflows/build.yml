# ============================================================
# AlgoViz 后端 CI：编译 → 静态检测 → 单元测试 → 打包 jar → 上传产物 → 打 tag 发布 Release
# 触发：push（含打 tag）、pull_request
# 发布：仅 push 到 v* 标签时触发 Release；普通 push / PR 只跑 CI，不发布
# ============================================================
# 【临时】docker job：push 即构建并推送 Docker 镜像到 ghcr.io
#         验证通过后移除本 job（正式版见 .github/workflows/docker.yml）
# ============================================================
name: CI Build & Release

on:
  push:          # 代码 push（含打 tag —— tag push 也是 push 事件）
  pull_request:  # 合并请求

permissions:
  contents: write   # 允许打 tag 时创建 Release（软著/版本发布用）
  packages: read    # 允许下载 ghcr.io / GitHub Packages 中的包（jar 依赖 / 镜像）

jobs:
  build:
    name: 编译·检测·测试·打包
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17 + Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'          # 项目 java.version = 17（Spring Boot 3.2）
          cache: maven

      # houduan 依赖 com.algoviz:know-api:1.0.0（algo-common-api 公共模块），
      # 必须先 install 到本地 Maven 仓库，houduan 才能编译
      - name: 0) 构建公共模块（algo-common-api → know-api / know-qrdant）
        working-directory: algo-common-api
        run: mvn -B -q install -DskipTests

      # 静态检测：编译期即做类型/引用检查（如需更严格可换 SpotBugs/Checkstyle：
      #   mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check）
      - name: 1) 静态检测（编译检查）
        working-directory: houduan
        run: mvn -B -q -DskipTests compile

      - name: 2) 单元测试
        working-directory: houduan
        run: mvn -B test

      - name: 3) 打包 jar
        working-directory: houduan
        run: mvn -B package -DskipTests

      - name: 4) 上传构建产物（push / PR / tag 均上传）
        uses: actions/upload-artifact@v4
        with:
          name: houduan-backend-jar
          path: houduan/target/*.jar
          if-no-files-found: error

      # 仅打 tag（如 git tag v1.0.0 && git push --tags）时发布 GitHub Release；
      # 普通 push 分支 / PR 到这一步直接跳过，不会创建 Release
      - name: 5) 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: houduan/target/*.jar
          generate_release_notes: true

  # ============================================================
  # 【临时】提交（push）即构建并推送 Docker 镜像到 ghcr.io
  #   - push 到 main：推 backend/nginx:latest
  #   - push 其他分支：推 :分支名
  #   - 打 tag：推 :版本号 + :latest
  #   验证通过后移除本 job（正式版见 docker.yml）
  # ============================================================
  docker:
    name: 临时 Docker 构建并推送
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # 推送 ghcr.io 需要（此前 Actions "无下载权限" 的根因就是漏了它）
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"; OWNER="${OWNER,,}"
          REPO="${GITHUB_REPOSITORY##*/}";     REPO="${REPO,,}"
          BASE="ghcr.io/${OWNER}/${REPO}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            B="${BASE}/backend:${GITHUB_REF_NAME},${BASE}/backend:latest"
            N="${BASE}/nginx:${GITHUB_REF_NAME},${BASE}/nginx:latest"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            B="${BASE}/backend:latest"
            N="${BASE}/nginx:latest"
          else
            BR="${GITHUB_REF_NAME//\//-}"
            B="${BASE}/backend:${BR}"
            N="${BASE}/nginx:${BR}"
          fi
          echo "backend_tags=${B}" >> "$GITHUB_OUTPUT"
          echo "nginx_tags=${N}"   >> "$GITHUB_OUTPUT"

      - name: 构建后端镜像 backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建 Nginx 镜像 nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.nginx_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
