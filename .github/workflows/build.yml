# ============================================================
# AlgoViz 后端 CI 流水线（按事件分级）
#
#  1) push 到分支（非默认）→ 快速检查：静态检测 + 单元测试 + 依赖安全扫描
#  2) pull_request       → 全面 CI：测试 + 打包 jar + 上传产物 + 安全扫描
#  3) push 到默认分支    → 构建成品 jar（PR 合并后触发；不打 Docker 镜像）
#  4) push v* 标签       → 发布 GitHub Release（附 jar 附件）
#
# 安全实践：
#  - 所有第三方 Action 使用完整 commit SHA 固定（防供应链篡改，SonarCloud 要求）
#  - 写权限（contents/security-events）只放在需要的 job 级，workflow 级仅只读
#
#  Docker 镜像构建不在 CI 自动触发，见 docker.yml（workflow_dispatch 手动）
# ============================================================
name: CI Build & Release

on:
  push:            # 分支 push（含 PR 合并到 main、打 tag）
  pull_request:    # 合并请求

permissions:
  contents: read   # workflow 级只读；写权限在各 job 内单独声明

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 1) push 到分支：快速检查 ============
  quick-check:
    name: 快速检查（push 分支）
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # 上报 SARIF 需要
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 配置 JDK 17 + Maven 缓存
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建公共模块（algo-common-api）
        working-directory: algo-common-api
        run: mvn -B -q install -DskipTests

      - name: 静态检测（编译检查）
        working-directory: houduan
        run: mvn -B -q -DskipTests compile

      - name: 单元测试
        working-directory: houduan
        run: mvn -B test

      - name: 依赖安全扫描（Trivy 快速子集，结果上报 Code Scanning）
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0（供应链事件后唯一确认安全版本）
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 上传扫描结果
        if: always()
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939  # v4
        with:
          sarif_file: trivy-results.sarif

  # ============ 2) PR：全面 CI ============
  full-ci:
    name: 全面 CI（PR）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # 上报 SARIF 需要
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 配置 JDK 17 + Maven 缓存
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建公共模块（algo-common-api）
        working-directory: algo-common-api
        run: mvn -B -q install -DskipTests

      - name: 静态检测（编译检查）
        working-directory: houduan
        run: mvn -B -q -DskipTests compile

      - name: 单元测试
        working-directory: houduan
        run: mvn -B test

      - name: 打包 jar
        working-directory: houduan
        run: mvn -B package -DskipTests

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: houduan-backend-jar
          path: houduan/target/*.jar
          if-no-files-found: error

      - name: 依赖安全扫描（Trivy，结果上报 Code Scanning）
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 上传扫描结果
        if: always()
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939  # v4
        with:
          sarif_file: trivy-results.sarif

  # ============ 3) push 到默认分支（PR 合并后）：构建成品 jar ============
  build-artifact:
    name: 构建成品（合并后）
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 配置 JDK 17 + Maven 缓存
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建公共模块（algo-common-api）
        working-directory: algo-common-api
        run: mvn -B -q install -DskipTests

      - name: 打包成品 jar
        working-directory: houduan
        run: mvn -B package -DskipTests

      - name: 上传成品（Actions → 本运行 → Artifacts 下载）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: houduan-backend-release
          path: houduan/target/*.jar
          if-no-files-found: error

  # ============ 4) 打 tag：发布 Release ============
  release:
    name: 发布 Release（tag）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 GitHub Release 需要（最小权限，仅此 job）
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 配置 JDK 17 + Maven 缓存
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建公共模块（algo-common-api）
        working-directory: algo-common-api
        run: mvn -B -q install -DskipTests

      - name: 打包
        working-directory: houduan
        run: mvn -B package -DskipTests

      - name: 发布 Release（附 jar）
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: houduan/target/*.jar
          generate_release_notes: true
