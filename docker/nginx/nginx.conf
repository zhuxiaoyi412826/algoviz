# ====== AlgoViz 站点配置 ======
# 由 docker-compose 挂载 ./ssl 到 /etc/nginx/ssl 提供证书

# 80 强制跳转 443
server {
    listen 80;
    server_name dsaol.asia;

    # 微信支付回调等若强制 http 可在此放行（生产建议统一 https）
    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 HTTPS 主入口
server {
    listen 443 ssl;
    http2 on;
    server_name dsaol.asia;

    ssl_certificate     /etc/nginx/ssl/dsaol.asia_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/dsaol.asia.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前台根目录
    root /usr/share/nginx/html;
    index index.html;

    # 前台 SPA / 静态页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台管理界面（Vue3 dist）
    location /admin/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端 API 反代：
    # 关键——伪装 Host: dsaol.asia，替代原 cors-proxy 的 403 绕过逻辑
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host dsaol.asia;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # 上传文件静态访问（后端 FileUploadUtil 写入 /app/uploads）
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host dsaol.asia;
    }
}
