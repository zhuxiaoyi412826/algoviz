<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线OJ - 题目详情</title>
    <link rel="icon" type="image/png" href="../images/tubiao.png">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/oj.css">
    <script src="../js/main.js"></script>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body onload="initTheme()">
    <!-- Top Control Bar -->
    <div class="oj-top-bar">
        <!-- Left Section -->
        <div class="oj-top-left">
            <button id="ojBackToListBtn" class="oj-top-btn" title="返回题目列表">
                <span>←</span> 题库
            </button>
        </div>

        <!-- Center Section -->
        <div class="oj-top-center">
            <button id="ojPrevBtn" class="oj-top-btn" title="上一题">
                <span>◀</span>
            </button>
            <button id="ojNextBtn" class="oj-top-btn" title="下一题">
                <span>▶</span>
            </button>
            <button id="ojRunBtn" class="oj-top-btn oj-run-btn" title="运行代码">
                <span>▶</span> 运行
            </button>
            <button id="ojSubmitBtn" class="oj-top-btn oj-submit-btn" title="提交代码">
                <span>📤</span> 提交
            </button>
        </div>

        <!-- Right Section -->
        <div class="oj-top-right">
            <button id="ojFormatBtn" class="oj-top-btn" title="格式化代码">
                <span>🎨</span>
            </button>
            <button id="ojCopyBtn" class="oj-top-btn" title="复制代码">
                <span>📋</span>
            </button>
            <button id="ojClearBtn" class="oj-top-btn" title="清空代码">
                <span>🗑️</span>
            </button>
            <button id="ojFullscreenBtn" class="oj-top-btn" title="全屏编辑">
                <span>⛶</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="oj-container" id="ojContainer">
        <!-- Resizable Layout -->
        <div class="oj-resizable-layout">
            <!-- Left: Problem Description + Solution -->
            <div class="oj-resizable-left" id="ojResizableLeft">
                <div class="oj-problem-desc" id="ojProblemDesc">
                    <!-- Panel Tabs -->
                    <div class="oj-panel-header" style="flex-direction: column; align-items: stretch; gap: 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div class="oj-problem-tabs">
                                <button class="oj-problem-tab active" data-tab="description">📝 题目描述</button>
                                <button class="oj-problem-tab" data-tab="solution">💡 解法</button>
                                <button class="oj-problem-tab" data-tab="submissions">📊 提交记录</button>
                            </div>
                            <span class="oj-problem-difficulty" id="ojProblemDifficulty"></span>
                        </div>
                        <!-- Language selector for solution tab -->
                        <div id="ojSolutionLangBar" style="display: none; padding: 8px 12px; background: rgba(102,126,234,0.08); border-bottom: 1px solid #3c3c3c; align-items: center; gap: 10px;">
                            <span style="font-size: 12px; color: #858585;">选择语言：</span>
                            <select id="ojSolutionLangSelect" class="oj-filter-select" style="flex: 1; max-width: 200px;">
                                <option value="java">Java</option>
                                <option value="c">C</option>
                                <option value="python">Python</option>
                                <option value="go">Go</option>
                            </select>
                        </div>
                    </div>

                    <!-- Problem Content (Description Tab) -->
                    <div class="oj-problem-content" id="ojProblemContent">
                        <div class="oj-loading">
                            <div class="oj-spinner"></div>
                            <span>加载题目中...</span>
                        </div>
                    </div>

                    <!-- Solution Content -->
                    <div class="oj-problem-content" id="ojSolutionContent" style="display: none;">
                        <div class="oj-loading">
                            <div class="oj-spinner"></div>
                            <span>加载解法中...</span>
                        </div>
                    </div>

                    <!-- Submissions Content -->
                    <div class="oj-problem-content" id="ojSubmissionsContent" style="display: none;">
                        <div class="oj-empty-state">
                            <div class="oj-empty-icon" style="font-size: 32px; margin-bottom: 8px;">📊</div>
                            <p>暂无提交记录</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Resize Handle -->
            <div class="oj-resize-handle" id="ojResizeHandle"></div>

            <!-- Right: Editor + Result -->
            <div class="oj-resizable-right" id="ojResizableRight">
                <!-- Editor Header -->
                <div class="oj-editor-header" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #252526; border-bottom: 1px solid #3c3c3c;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="font-size: 12px; color: #858585;">语言：</span>
                        <select id="ojLangSelect" class="oj-filter-select" style="padding: 5px 10px; font-size: 12px;">
                            <option value="java">Java</option>
                            <option value="c">C</option>
                            <option value="python">Python</option>
                            <option value="go">Go</option>
                        </select>
                    </div>
                    <div class="oj-editor-actions" style="display: flex; gap: 4px; margin-left: auto;">
                        <button class="oj-top-btn" id="ojFormatBtn2" title="格式化">
                            <span>🎨</span>
                        </button>
                        <button class="oj-top-btn" id="ojClearBtn2" title="清空">
                            <span>🗑️</span>
                        </button>
                        <button class="oj-top-btn" id="ojCopyBtn2" title="复制">
                            <span>📋</span>
                        </button>
                        <button class="oj-top-btn" id="ojFullscreenBtn2" title="全屏">
                            <span>⛶</span>
                        </button>
                    </div>
                </div>

                <!-- Resizable Vertical Layout -->
                <div class="oj-vertical-layout" id="ojVerticalLayout">
                    <!-- Code Editor -->
                    <div class="oj-vertical-top" id="ojVerticalTop">
                        <div class="oj-editor-container" id="ojEditorContainer">
                            <textarea id="ojCodeEditor">// 加载中...
// 请等待题目数据加载</textarea>
                        </div>
                    </div>

                    <!-- Vertical Resize Handle -->
                    <div class="oj-vertical-resize-handle" id="ojVerticalResizeHandle"></div>

                    <!-- Bottom Panel: Test Input + Result -->
                    <div class="oj-vertical-bottom" id="ojVerticalBottom">
                        <div style="display: flex; gap: 0; height: 100%;">
                            <!-- Test Input -->
                            <div style="flex: 1; display: flex; flex-direction: column; border-right: 1px solid #3c3c3c;">
                                <div class="oj-panel-header" style="padding: 6px 10px; background: #252526; border-bottom: 1px solid #3c3c3c;">
                                    <span style="font-size: 11px; font-weight: 600; color: #858585;">测试输入</span>
                                </div>
                                <textarea id="ojCustomInput" placeholder="输入测试数据...（可选）" style="flex: 1; padding: 10px; background: #1e1e1e; border: none; color: #d4d4d4; font-family: 'Fira Code', monospace; font-size: 12px; resize: none; outline: none;"></textarea>
                            </div>

                            <!-- Result Panel -->
                            <div style="flex: 2; display: flex; flex-direction: column;">
                                <div class="oj-result-header" style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #252526; border-bottom: 1px solid #3c3c3c;">
                                    <div class="oj-result-tabs">
                                        <button class="oj-result-tab active" data-tab="output">运行结果</button>
                                        <button class="oj-result-tab" data-tab="testcase">测试用例</button>
                                    </div>
                                </div>
                                <div class="oj-result-body" id="ojResultBody" style="flex: 1; padding: 10px; font-family: 'Fira Code', monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; overflow-y: auto;">
                                    <div class="oj-empty-state" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #6a6a6a;">
                                        <div style="font-size: 32px; margin-bottom: 8px;">▶</div>
                                        <span>点击运行查看结果</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Overlay -->
    <div class="oj-fullscreen-overlay" id="ojFullscreenOverlay">
        <div class="oj-fullscreen-header">
            <div class="oj-lang-selector" style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 12px; color: #858585;">语言：</span>
                <select id="ojFullscreenLangSelect" class="oj-filter-select" style="padding: 5px 10px; font-size: 12px;">
                    <option value="java">Java</option>
                    <option value="c">C</option>
                    <option value="python">Python</option>
                    <option value="go">Go</option>
                </select>
            </div>
            <div class="oj-fullscreen-actions" style="display: flex; gap: 6px;">
                <button class="oj-top-btn" id="ojFullscreenFormatBtn" title="格式化">
                    <span>🎨</span>
                </button>
                <button class="oj-top-btn" id="ojFullscreenClearBtn" title="清空">
                    <span>🗑️</span>
                </button>
                <button class="oj-top-btn" id="ojFullscreenCopyBtn" title="复制">
                    <span>📋</span>
                </button>
                <button class="oj-top-btn" id="ojExitFullscreenBtn" title="退出全屏">
                    <span>⛶</span>
                </button>
            </div>
        </div>
        <div class="oj-fullscreen-editor-container">
            <textarea id="ojFullscreenCodeEditor"></textarea>
        </div>
        <div class="oj-fullscreen-footer" style="display: flex; justify-content: flex-end; padding: 10px 12px; background: #252526; border-top: 1px solid #3c3c3c; gap: 8px;">
            <button id="ojFullscreenRunBtn" class="oj-top-btn oj-run-btn" style="color: #4ec9b0; padding: 5px 14px; border: 1px solid #3c3c3c; border-radius: 4px; background: transparent; cursor: pointer;">
                <span>▶</span> 运行
            </button>
            <button id="ojFullscreenSubmitBtn" class="oj-top-btn oj-submit-btn" style="color: #4ec9b0; padding: 5px 14px; border: none; border-radius: 4px; background: rgba(78,201,176,0.15); cursor: pointer; font-weight: 600;">
                <span>📤</span> 提交
            </button>
        </div>
    </div>

    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/haxe/haxe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

    <!-- marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="../js/oj.js"></script>
</body>

</html>
