    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #7c3aed;
            --secondary: #a855f7;
            --bg: #0f0f23;
            --card-bg: #1a1a2e;
            --border: #2d2d4a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --hover-bg: #252540;
        }
        
        [data-theme="light"] {
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-primary: #1a1a2e;
            --text-secondary: #64748b;
            --hover-bg: #f1f5f9;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        .nav {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.25rem;
        }
        
        .nav-logo-icon {
            font-size: 1.5rem;
        }
        
        .text-gradient {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        
        .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
        }
        
        .nav-link:hover {
            color: var(--primary);
        }
        
        .nav-avatar {
            font-size: 1rem;
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            transition: all 0.2s ease;
        }
        
        .nav-avatar:hover {
            transform: scale(1.1);
        }
        
        .visit-counter {
            margin-right: 1rem;
            padding: 0.5rem 1rem;
            background: var(--hover-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .page-header {
            margin-bottom: 2rem;
        }
        
        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .page-desc {
            color: var(--text-secondary);
        }

        /* 数据源状态条（加载中 / 成功 / 失败 fallback） */
        .source-banner {
            max-width: 1200px;
            margin: 0 auto 20px;
            border-radius: 10px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid;
            background: rgba(124,58,237,.08);
            color: var(--text-primary);
        }
        .source-banner .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 0 4px rgba(124,58,237,.15);
            flex-shrink: 0;
            animation: source-blink 1.2s ease-in-out infinite;
        }
        .source-banner__url {
            margin-left: auto;
            font-family: 'Fira Code', ui-monospace, Consolas, monospace;
            font-size: 11.5px;
            color: var(--text-secondary);
            text-decoration: none;
            opacity: .75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }
        .source-banner__url:hover { opacity: 1; color: var(--primary); }
        .source-banner--ok {
            background: rgba(22,163,74,.08);
            border-color: rgba(22,163,74,.3);
        }
        .source-banner--ok .dot {
            background: #16a34a;
            box-shadow: 0 0 0 4px rgba(22,163,74,.18);
            animation: none;
        }
        .source-banner--warn {
            background: rgba(234,179,8,.1);
            border-color: rgba(234,179,8,.35);
        }
        .source-banner--warn .dot {
            background: #eab308;
            box-shadow: 0 0 0 4px rgba(234,179,8,.2);
            animation: none;
        }
        .source-banner--err {
            background: rgba(239,68,68,.08);
            border-color: rgba(239,68,68,.3);
        }
        .source-banner--err .dot {
            background: #ef4444;
            box-shadow: 0 0 0 4px rgba(239,68,68,.18);
            animation: none;
        }
        @keyframes source-blink {
            0%,100% { transform: scale(1); opacity: 1; }
            50%     { transform: scale(1.3); opacity: .7; }
        }
        @media (max-width: 860px) {
            .source-banner { font-size: 12px; padding: 10px 12px; flex-wrap: wrap; }
            .source-banner__url { max-width: 100%; margin-left: 0; width: 100%; }
        }

        .changelog-container {
            display: flex;
            gap: 2rem;
        }
        
        .changelog-sidebar {
            width: 200px;
            flex-shrink: 0;
        }
        
        .changelog-filters {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            position: sticky;
            top: 6rem;
        }
        
        .filter-title {
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .filter-group {
            margin-bottom: 1.5rem;
        }
        
        .filter-group-title {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        
        .filter-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .filter-option:hover {
            background: var(--hover-bg);
        }
        
        .filter-option.active {
            background: var(--primary);
            color: white;
        }
        
        .sort-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .sort-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        
        .sort-btn:hover {
            border-color: var(--primary);
        }
        
        .sort-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        .changelog-content {
            flex: 1;
        }
        
        .changelog-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .changelog-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .changelog-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        
        .changelog-header:hover {
            background: var(--hover-bg);
        }
        
        .changelog-version {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .version-number {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
        }
        
        .version-type {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .version-type.new {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        
        .version-type.optimize {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        
        .version-type.fix {
            background: rgba(249, 115, 22, 0.2);
            color: #f97316;
        }
        
        .version-type.urgent {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .version-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .changelog-body {
            display: none;
            padding: 1.5rem;
        }
        
        .changelog-body.open {
            display: block;
        }
        
        .changelog-summary {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--hover-bg);
            border-radius: 8px;
        }
        
        .changelog-modules {
            margin-bottom: 1.5rem;
        }
        
        .modules-title {
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .modules-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .module-tag {
            padding: 0.25rem 0.75rem;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        
        .changelog-details {
            margin-bottom: 1.5rem;
        }
        
        .details-title {
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .details-content {
            color: var(--text-secondary);
            line-height: 1.8;
        }
        /* Markdown 渲染（details 区）通用样式，兼容 h1~h6 / ul/ol / code / blockquote / table */
        .details-content h1,
        .details-content h2,
        .details-content h3,
        .details-content h4 {
            color: var(--text-primary);
            margin: 18px 0 10px;
            line-height: 1.4;
            font-weight: 600;
        }
        .details-content h1 { font-size: 1.35rem; }
        .details-content h2 { font-size: 1.2rem; }
        .details-content h3 { font-size: 1.05rem; }
        .details-content p { margin: 8px 0; }
        .details-content ul,
        .details-content ol {
            padding-left: 0;
            list-style: none;
        }
        .details-content li {
            padding: 0.5rem 0;
            padding-left: 1.5rem;
            position: relative;
        }
        .details-content ul li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
        }
        .details-content ol { counter-reset: md-ol; }
        .details-content ol li::before {
            counter-increment: md-ol;
            content: counter(md-ol) ".";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
        }
        .details-content code {
            background: var(--hover-bg);
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.9em;
            color: var(--secondary);
        }
        .details-content pre {
            background: var(--hover-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            overflow-x: auto;
            margin: 12px 0;
        }
        .details-content pre code {
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text-primary);
        }
        .details-content blockquote {
            border-left: 4px solid var(--primary);
            padding: 6px 14px;
            margin: 10px 0;
            background: var(--hover-bg);
            border-radius: 0 6px 6px 0;
            color: var(--text-secondary);
        }
        .details-content a {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px dashed var(--primary);
        }
        .details-content a:hover { opacity: .85; }
        .details-content table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
            font-size: 0.9rem;
        }
        .details-content table th,
        .details-content table td {
            border: 1px solid var(--border);
            padding: 6px 10px;
        }
        .details-content table th {
            background: var(--hover-bg);
        }
        
        .changelog-issues {
            padding: 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
        }
        
        .issues-title {
            color: #ef4444;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .issues-content {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.8;
        }
        .issues-content p { margin: 6px 0; }
        .issues-content ul, .issues-content ol { padding-left: 20px; }
        .issues-content code {
            background: rgba(239, 68, 68, 0.12);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', ui-monospace, monospace;
            font-size: 0.9em;
        }
        
        .expand-icon {
            transition: transform 0.3s ease;
        }
        
        .expand-icon.open {
            transform: rotate(180deg);
        }
        
        @media (max-width: 768px) {
            .changelog-container {
                flex-direction: column;
            }
            
            .changelog-sidebar {
                width: 100%;
            }
            
            .changelog-filters {
                position: static;
            }
        }
    </style>
</head>

    <script>
    (function() {
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('algoviz-theme', theme);
            var btn = document.getElementById('themeToggle');
            if (btn) {
                var icon = btn.querySelector('.theme-icon');
                if (icon) {
                    icon.textContent = theme === 'dark' ? '🌙' : '☀️';
                }
            }
            document.body.style.background = theme === 'dark' ? '#0f0f23' : '#f5f7fa';
        }

        function initTheme() {
            var saved = localStorage.getItem('algoviz-theme') || 'light';
            setTheme(saved);
        }
        window.initTheme = initTheme;

        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme') || 'light';
            var next = current === 'dark' ? 'light' : 'dark';
            setTheme(next);
        }

        // 访问量计数
        function updateVisitCount() {
            var count = localStorage.getItem('visitCount') || 0;

            // 检查当前浏览器是否已经记录过访问
            var hasVisited = localStorage.getItem('hasVisitedUnique');
            if (!hasVisited) {
                count = parseInt(count) + 1;
                localStorage.setItem('visitCount', count);
                localStorage.setItem('hasVisitedUnique', 'true');
            }

            var visitCountElement = document.getElementById('visitCount');
            if (visitCountElement) {
                visitCountElement.textContent = count;
            }
        }

        // 检查登录状态并更新头像
        function checkLoginStatus() {
            var isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            var navAvatar = document.getElementById('navAvatar');
            var profileLink = document.getElementById('profileLink');

            if (isLoggedIn) {
                var userAvatar = localStorage.getItem('userAvatar') || '👤';
                navAvatar.textContent = userAvatar;
                profileLink.href = 'profile.html';
            } else {
                navAvatar.textContent = '👨';
                profileLink.href = 'login.html';
            }
        }

        window.toggleTheme = toggleTheme;
        window.setTheme = setTheme;

        // 初始化主题（等同 body onload="initTheme()"，但直接执行避免 onload 找不到函数）
        initTheme();

        var btn = document.getElementById('themeToggle');
        if (btn) {
            btn.addEventListener('click', toggleTheme);
        }

        // 检查登录状态
        checkLoginStatus();

        // 更新访问量显示
        updateVisitCount();
    })();
    </script>

                    <a href="../pages/changelog.html" class="footer-link">更新日志</a>
                    <span class="footer-divider">|</span>
                    <a href="../pages/suggestion.html" class="footer-link">建议我</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="../js/site-footer.js" defer></script>
    </main>

    <script>
        function toggleChangelog(header) {
            const body = header.nextElementSibling;
            const icon = header.querySelector('.expand-icon');
            body.classList.toggle('open');
            icon.classList.toggle('open');
        }

        // ================================================================
        // 动态渲染：从后端公开接口 GET /api/public/changelog 拉数据，
        // 支持左侧更新类型筛选、按时间/版本排序，Markdown 渲染详情，
        // 失败时 fallback 到原 5 条硬编码卡片
        // ================================================================
        (function () {
            var TYPE_LABEL = { new: '新增', optimize: '优化', fix: '修复', urgent: '紧急更新' };
            var currentFilter = 'all';
            var currentSort = 'time';   // time | version
            var rawList = [];           // 从接口拿到的未过滤数据
            var API_BASE = (function () {
                try {
                    // 优先级 1：页面上手动写死的 window.__API_BASE__（给部署在非 80 端口的用户兜底）
                    if (window.__API_BASE__) return String(window.__API_BASE__).replace(/\/+$/, '');

                    var origin = window.location.origin || '';
                    // file:// 或 chrome newtab 会把 origin 写成字符串 "null"
                    var isLocalFile = !origin
                        || origin === 'null'
                        || origin.indexOf('file:') === 0;
                    if (isLocalFile) return 'http://localhost';

                    // 优先级 2：如果当前 origin 跑在"前端静态服务器"端口（LiveServer 5500 / Vite 5173/4173
                    //         / CRA 3000 / Python http.server 8000 / Webpack devServer 8080 等），
                    //         说明它不可能同时是后端，直接去掉端口 → 回落到 http(s)://<hostname>（通常是 80/443 的后端）
                    try {
                        var u = new URL(origin);
                        var staticPorts = {
                            '5500': 1, '5501': 1,
                            '5173': 1, '5174': 1, '4173': 1,
                            '3000': 1, '3001': 1, '3002': 1,
                            '8000': 1, '8001': 1, '8080': 1, '8081': 1, '8100': 1,
                            '9000': 1, '9001': 1, '5175': 1, '5176': 1
                        };
                        if (u.port && staticPorts[u.port]) {
                            return (u.protocol + '//' + u.hostname).replace(/\/+$/, '');
                        }
                    } catch (ue) { /* 非标准 URL，继续走 origin */ }

                    return origin.replace(/\/+$/, '');
                } catch (e) { return 'http://localhost'; }
            })();
            var REQUEST_URL = '';  // 记录实际请求地址，展示给用户排错

            function detectMarkdown() {
                // marked + DOMPurify 都加载好
                return !!window.marked && !!window.DOMPurify;
            }

            function renderMarkdown(md) {
                if (!md || !md.trim()) return '';
                var raw = md;
                if (detectMarkdown()) {
                    try {
                        var html = typeof marked.parse === 'function' ? marked.parse(raw) : raw;
                        return DOMPurify.sanitize(html);
                    } catch (e) { return raw; }
                }
                // 没加载到 CDN 时，退化成简单换行转 <br>
                return raw.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
            }

            function parseModules(modulesStr) {
                try {
                    var arr = JSON.parse(modulesStr || '[]');
                    return Array.isArray(arr) ? arr : [];
                } catch (e) { return []; }
            }

            function buildCardHtml(item, open) {
                var type = item.type || 'new';
                var typeLabel = TYPE_LABEL[type] || '新增';
                var modules = parseModules(item.modules);
                var moduleTags = modules.length
                    ? modules.map(function (m) { return '<span class="module-tag">' + escapeHtml(m) + '</span>'; }).join('\n')
                    : '';
                var summary = (item.summary || '').trim();
                var summaryHtml = summary
                    ? '<div class="changelog-summary"><strong>本次更新摘要：</strong>' + escapeHtml(summary) + '</div>'
                    : '';
                var modulesHtml = moduleTags
                    ? ('<div class="changelog-modules"><div class="modules-title">功能模块</div><div class="modules-list">' + moduleTags + '</div></div>')
                    : '';
                var detailsHtml =
                    '<div class="changelog-details">' +
                    '  <div class="details-title">完整更新说明</div>' +
                    '  <div class="details-content">' + renderMarkdown(item.details || '') + '</div>' +
                    '</div>';

                var issuesMarkdown = (item.knownIssues || '').trim();
                var issuesBody = issuesMarkdown ? renderMarkdown(issuesMarkdown) : '暂无已知问题';
                var issuesTitle = (item.issuesTitle || '已知问题').trim();
                var issuesHtml =
                    '<div class="changelog-issues">' +
                    '  <div class="issues-title">' + escapeHtml(issuesTitle) + '</div>' +
                    '  <div class="issues-content">' + issuesBody + '</div>' +
                    '</div>';

                return (
                    '<div class="changelog-card" data-type="' + type + '">' +
                    '  <div class="changelog-header" onclick="toggleChangelog(this)">' +
                    '    <div class="changelog-version">' +
                    '      <span class="version-number">' + escapeHtml(item.version || '') + '</span>' +
                    '      <span class="version-type ' + type + '">' + typeLabel + '</span>' +
                    '    </div>' +
                    '    <div class="version-meta">' +
                    '      <span>' + escapeHtml(item.releaseDate || '') + '</span>' +
                    '      <span class="expand-icon' + (open ? ' open' : '') + '">▼</span>' +
                    '    </div>' +
                    '  </div>' +
                    '  <div class="changelog-body' + (open ? ' open' : '') + '">' +
                         summaryHtml + modulesHtml + detailsHtml + issuesHtml +
                    '  </div>' +
                    '</div>'
                );
            }

            function escapeHtml(s) {
                if (s == null) return '';
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function sortList(list, sortKey) {
                var arr = list.slice();
                if (sortKey === 'version') {
                    // 解析 v1.2.3 → [1,2,3]，字典序按数字分段比较
                    arr.sort(function (a, b) {
                        return cmpVersion(a.version || '', b.version || '');
                    });
                } else {
                    arr.sort(function (a, b) {
                        var da = a.releaseDate || '';
                        var db = b.releaseDate || '';
                        if (da === db) return (b.id || 0) - (a.id || 0);
                        return da < db ? 1 : -1;   // 时间倒序
                    });
                }
                return arr;
            }

            function cmpVersion(a, b) {
                function toNums(v) {
                    return (v || '').replace(/^v/i, '').split(/[.-]/).map(function (x) {
                        var n = parseInt(x, 10); return isNaN(n) ? 0 : n;
                    });
                }
                var na = toNums(a), nb = toNums(b);
                var max = Math.max(na.length, nb.length);
                for (var i = 0; i < max; i++) {
                    var va = na[i] || 0, vb = nb[i] || 0;
                    if (va !== vb) return vb - va;   // 版本号倒序（大的在前）
                }
                return 0;
            }

            function render() {
                var filtered = rawList;
                if (currentFilter !== 'all') {
                    filtered = filtered.filter(function (it) { return (it.type || '') === currentFilter; });
                }
                var sorted = sortList(filtered, currentSort);
                var container = document.getElementById('changelogList');
                if (!container) return;
                if (!sorted.length) {
                    container.innerHTML =
                        '<div style="color:var(--text-secondary);padding:40px;text-align:center;border:1px dashed var(--border);border-radius:12px;">暂无符合条件的更新日志</div>';
                    return;
                }
                container.innerHTML = sorted.map(function (it, idx) {
                    // 第一条默认展开
                    return buildCardHtml(it, idx === 0);
                }).join('\n');
            }

            function bindFilterButtons() {
                document.querySelectorAll('.sort-btn').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        document.querySelectorAll('.sort-btn').forEach(function (b) { b.classList.remove('active'); });
                        btn.classList.add('active');
                        currentSort = btn.getAttribute('data-sort') === 'version' ? 'version' : 'time';
                        render();
                    });
                });
                document.querySelectorAll('.filter-option').forEach(function (opt) {
                    opt.addEventListener('click', function () {
                        document.querySelectorAll('.filter-option').forEach(function (o) { o.classList.remove('active'); });
                        opt.classList.add('active');
                        var f = opt.getAttribute('data-filter') || 'all';
                        currentFilter = f;
                        render();
                    });
                });
            }

            function setBanner(cls, text, withUrl) {
                var bn = document.getElementById('changelogSourceBanner');
                var tx = document.getElementById('changelogSourceText');
                var a  = document.getElementById('changelogSourceUrl');
                if (!bn || !tx) return;
                bn.className = 'source-banner ' + (cls || '');
                tx.textContent = text || '';
                if (a) {
                    if (withUrl && REQUEST_URL) {
                        a.href = REQUEST_URL;
                        a.textContent = REQUEST_URL;
                        a.style.display = '';
                    } else {
                        a.href = '#';
                        a.textContent = '';
                        a.style.display = 'none';
                    }
                }
            }

            /**
             * 失败 fallback：恢复原 5 条硬编码
             */
            function fallbackHardcoded(errMsg) {
                var defaults = [
                    { id: 1, version: 'v1.2.3', type: 'new', summary: '新增个人中心页面，支持用户头像自定义和设置管理', releaseDate: '2024-04-22',
                      modules: JSON.stringify(['个人中心','用户设置','头像系统']),
                      details: '- 新增个人中心页面，包含账号信息、订单、产品服务等功能\n- 支持18个默认头像选择，可切换使用\n- 支持上传本地图片作为头像\n- 新增设置功能，可修改姓名、性别、头像、密码\n- 集成商品页面和支付功能入口',
                      knownIssues: '', issuesTitle: '已知问题' },
                    { id: 2, version: 'v1.2.2', type: 'optimize', summary: '优化导航栏结构，新增商品展示页面', releaseDate: '2024-04-21',
                      modules: JSON.stringify(['导航栏','商品页面','支付系统']),
                      details: '- 导航栏新增商品入口，支持快速访问商品页面\n- 新增商品分类功能，支持按笔记、教程、项目筛选\n- 实现支付模态框，支持微信和支付宝二维码展示\n- 优化页面响应式布局，适配移动端设备',
                      knownIssues: '支付功能正在开发中，暂不支持真实支付', issuesTitle: '注意事项' },
                    { id: 3, version: 'v1.2.1', type: 'new', summary: '新增数据结构独立页面，优化数据结构选择交互', releaseDate: '2024-04-20',
                      modules: JSON.stringify(['数据结构','独立页面','数组可视化']),
                      details: '- 新增数组数据结构独立可视化页面\n- 数据结构选择区域居中显示，两行四列布局\n- 点击数据结构按钮跳转到对应独立页面\n- 新增查询、增加、删除、扩容操作按钮',
                      knownIssues: '部分数据结构独立页面仍在开发中', issuesTitle: '已知问题' },
                    { id: 4, version: 'v1.2.0', type: 'fix', summary: '修复多个可视化器初始化问题，优化页面加载性能', releaseDate: '2024-04-19',
                      modules: JSON.stringify(['可视化器','页面加载','基础组件']),
                      details: '- 修复 Trie 可视化器 setData 方法缺失问题\n- 修复并查集可视化器初始化错误\n- 修复线段树可视化器数据加载问题\n- 优化页面加载速度，减少初始化时间',
                      knownIssues: '', issuesTitle: '已知问题' },
                    { id: 5, version: 'v1.1.9', type: 'urgent', summary: '紧急修复暗色模式切换问题', releaseDate: '2024-04-18',
                      modules: JSON.stringify(['暗色模式','主题切换']),
                      details: '- 紧急修复主题切换按钮样式异常问题\n- 修复 LocalStorage 主题保存失效问题\n- 优化主题切换动画效果',
                      knownIssues: '请刷新页面以获取最新主题设置', issuesTitle: '注意事项' }
                ];
                rawList = defaults;
                render();
                // 黄色警告：回退到备份
                var reasonMap = {
                    'network_error': '网络请求失败 / 浏览器跨域被阻止',
                    'timeout': '接口超时（15 秒内没响应）',
                    'empty list': '接口返回了空列表',
                    'parse_': '响应体 JSON 解析失败',
                };
                var humanReason = (reasonMap[errMsg] || errMsg || '未知原因');
                if (errMsg && errMsg.indexOf('status_') === 0) {
                    humanReason = '后端返回了错误状态码：' + errMsg.substring(7);
                } else if (errMsg && errMsg.indexOf('parse_') === 0) {
                    humanReason = reasonMap['parse_'] + '：' + errMsg.substring(6);
                }
                setBanner(
                    'source-banner--warn',
                    '接口加载失败，已显示本地备份的 5 条更新日志 · 原因：' + humanReason,
                    true
                );
                if (window.console && console.warn) console.warn('[changelog] 回退到硬编码，原因=' + (errMsg || 'unknown') + '，req=' + REQUEST_URL);
            }

            function fetchApi() {
                // 若是直接双击打开本地文件（file:// 协议），浏览器会拦截跨域 HTTP 请求，直接走 fallback 并给出明显提示
                var protocol = (window.location && window.location.protocol) || '';
                if (protocol === 'file:') {
                    REQUEST_URL = 'file:// → ' + (API_BASE || '') + '/api/public/changelog (CORS 无法发起)';
                    var defaults = [
                        { id: 1, version: 'v1.2.3', type: 'new', summary: '新增个人中心页面，支持用户头像自定义和设置管理', releaseDate: '2024-04-22',
                          modules: JSON.stringify(['个人中心','用户设置','头像系统']),
                          details: '- 新增个人中心页面，包含账号信息、订单、产品服务等功能\n- 支持18个默认头像选择，可切换使用\n- 支持上传本地图片作为头像\n- 新增设置功能，可修改姓名、性别、头像、密码\n- 集成商品页面和支付功能入口',
                          knownIssues: '', issuesTitle: '已知问题' },
                        { id: 2, version: 'v1.2.2', type: 'optimize', summary: '优化导航栏结构，新增商品展示页面', releaseDate: '2024-04-21',
                          modules: JSON.stringify(['导航栏','商品页面','支付系统']),
                          details: '- 导航栏新增商品入口，支持快速访问商品页面\n- 新增商品分类功能，支持按笔记、教程、项目筛选\n- 实现支付模态框，支持微信和支付宝二维码展示\n- 优化页面响应式布局，适配移动端设备',
                          knownIssues: '支付功能正在开发中，暂不支持真实支付', issuesTitle: '注意事项' },
                        { id: 3, version: 'v1.2.1', type: 'new', summary: '新增数据结构独立页面，优化数据结构选择交互', releaseDate: '2024-04-20',
                          modules: JSON.stringify(['数据结构','独立页面','数组可视化']),
                          details: '- 新增数组数据结构独立可视化页面\n- 数据结构选择区域居中显示，两行四列布局\n- 点击数据结构按钮跳转到对应独立页面\n- 新增查询、增加、删除、扩容操作按钮',
                          knownIssues: '部分数据结构独立页面仍在开发中', issuesTitle: '已知问题' },
                        { id: 4, version: 'v1.2.0', type: 'fix', summary: '修复多个可视化器初始化问题，优化页面加载性能', releaseDate: '2024-04-19',
                          modules: JSON.stringify(['可视化器','页面加载','基础组件']),
                          details: '- 修复 Trie 可视化器 setData 方法缺失问题\n- 修复并查集可视化器初始化错误\n- 修复线段树可视化器数据加载问题\n- 优化页面加载速度，减少初始化时间',
                          knownIssues: '', issuesTitle: '已知问题' },
                        { id: 5, version: 'v1.1.9', type: 'urgent', summary: '紧急修复暗色模式切换问题', releaseDate: '2024-04-18',
                          modules: JSON.stringify(['暗色模式','主题切换']),
                          details: '- 紧急修复主题切换按钮样式异常问题\n- 修复 LocalStorage 主题保存失效问题\n- 优化主题切换动画效果',
                          knownIssues: '请刷新页面以获取最新主题设置', issuesTitle: '注意事项' }
                    ];
                    rawList = defaults;
                    render();
                    setBanner(
                        'source-banner--err',
                        '当前是通过双击本地文件（file://）打开的页面，浏览器出于安全策略会阻止发起 HTTP 请求；请通过 http://域名/pages/changelog.html 访问才能读取后端数据，当前显示的是本地备份 5 条示例',
                        false
                    );
                    return;
                }

                // 把左侧的 query 也带到后端（支持按类型/排序在服务端做过滤，若后端不支持则无所谓）
                var qs = [];
                if (currentFilter && currentFilter !== 'all') qs.push('type=' + encodeURIComponent(currentFilter));
                if (currentSort === 'version') qs.push('orderBy=version');
                var base = (API_BASE || '').replace(/\/$/, '');
                REQUEST_URL = base + '/api/public/changelog' + (qs.length ? ('?' + qs.join('&')) : '');

                setBanner(
                    'source-banner--loading',
                    '正在从后端接口加载更新日志…',
                    true
                );

                var xhr = new XMLHttpRequest();
                xhr.open('GET', REQUEST_URL, true);
                xhr.timeout = 15000;   // 从 8s 调到 15s，给网络不好的环境留余
                // 不加自定义 header，避免触发 CORS 预检
                xhr.onreadystatechange = function () {
                    if (xhr.readyState !== 4) return;
                    try {
                        if (xhr.status === 200) {
                            var json = JSON.parse(xhr.responseText);
                            var data = (json && (json.data || json.result || json.body)) || [];
                            if (!Array.isArray(data) || !data.length) {
                                fallbackHardcoded('empty list');
                            } else {
                                rawList = data;
                                render();
                                setBanner(
                                    'source-banner--ok',
                                    '已从后端接口加载 ' + data.length + ' 条更新日志（字段 details / knownIssues 是原始 Markdown，由前端 marked 渲染成 HTML）',
                                    true
                                );
                            }
                        } else {
                            fallbackHardcoded('status_' + xhr.status);
                        }
                    } catch (e) {
                        fallbackHardcoded('parse_' + (e && e.message));
                    }
                };
                xhr.onerror = function () { fallbackHardcoded('network_error'); };
                xhr.ontimeout = function () { fallbackHardcoded('timeout'); };
                try {
                    xhr.send();
                } catch (e) {
                    fallbackHardcoded('send_' + (e && e.message));
                }
            }

            // marked / DOMPurify CDN 若没加载上，等一会儿再试一次
            function ensureDepsThenInit() {
                if (detectMarkdown()) {
                    bindFilterButtons();
                    fetchApi();
                    return;
                }
                var retries = 0;
                var t = setInterval(function () {
                    retries++;
                    if (detectMarkdown() || retries >= 8) {
                        clearInterval(t);
                        bindFilterButtons();
                        fetchApi();
                    }
                }, 150);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', ensureDepsThenInit);
            } else {
                ensureDepsThenInit();
            }
        })();
    </script>
