<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - AlgoVize</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
        }
        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            outline: none;
        }
        .form-input:focus {
            border-color: #667eea;
        }
        .captcha-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .captcha-row .form-input {
            flex: 1;
        }
        .captcha-img {
            height: 44px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #e0e0e0;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }
        .tips {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #666;
        }
        .tips strong {
            color: #555;
        }
        .tips ul {
            margin-top: 8px;
            padding-left: 20px;
        }
        .tips li {
            margin-bottom: 4px;
        }
        .reset-link-box {
            margin-top: 16px;
            padding: 16px;
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .reset-link-box.show {
            display: block;
        }
        .reset-link-label {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 8px;
        }
        .reset-link-url {
            display: block;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            word-break: break-all;
            padding: 8px;
            background: white;
            border-radius: 6px;
            border: 1px solid #c7d2fe;
            margin-bottom: 8px;
        }
        .reset-link-url:hover {
            background: #f0f0ff;
        }
        .reset-link-hint {
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">🔐</div>
                <h1>忘记密码</h1>
                <p class="subtitle">输入您的邮箱，我们将发送重置链接</p>
            </div>
            
            <div id="message" class="message"></div>
            
            <form id="forgotForm">
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" id="forgotEmail" class="form-input" placeholder="请输入注册时的邮箱" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">人机验证</label>
                    <div class="captcha-row">
                        <input type="text" id="forgotCaptcha" class="form-input" placeholder="请输入验证码" maxlength="4" required>
                        <img id="forgotCaptchaImg" class="captcha-img" src="" alt="验证码" onclick="refreshCaptcha()" title="点击刷新">
                    </div>
                    <div id="captchaCode" style="font-size: 0.75rem; color: #999; margin-top: 4px; text-align: right;"></div>
                </div>
                
                <button type="submit" id="submitBtn" class="submit-btn">发送重置链接</button>
            </form>
            
            <div class="tips">
                <strong>💡 提示</strong>
                <ul>
                    <li>重置链接将在30分钟内有效</li>
                    <li>链接只能使用一次</li>
                    <li>如未收到链接，请检查垃圾邮件</li>
                </ul>
            </div>
            
            <!-- 重置链接显示区域 -->
            <div id="resetLinkBox" class="reset-link-box">
                <div class="reset-link-label">🔑 密码重置链接（开发模式）</div>
                <a id="resetLinkUrl" class="reset-link-url" href="#" target="_blank">点击打开重置密码页面</a>
                <div class="reset-link-hint">复制链接或点击上方链接前往重置密码</div>
            </div>
            
            <a href="login.html" class="back-link">← 返回登录</a>
        </div>
    </div>

    <script>
        // 获取API基础URL
        function getApiBaseUrl() {
            var protocol = window.location.protocol;
            var host = window.location.hostname || 'localhost';
            if (protocol === 'https:') {
                return 'https://' + host + ':3000';
            } else {
                return 'http://' + host + ':80';
            }
        }
        
        // 刷新验证码
        function refreshCaptcha() {
            fetch(getApiBaseUrl() + '/api/captcha/generate', {
                method: 'GET',
                credentials: 'include'
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    document.getElementById('forgotCaptchaImg').src = data.image;
                    // 开发模式：在验证码图片下方显示验证码代码
                    var codeDisplay = document.getElementById('captchaCode');
                    if (codeDisplay) {
                        codeDisplay.textContent = '验证码: ' + (data.code || '???');
                    }
                }
            })
            .catch(function(err) { console.error('获取验证码失败:', err); });
        }
        
        // 显示消息
        function showMessage(text, type) {
            var msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }
        
        // 处理忘记密码提交
        async function handleForgotPassword() {
            var email = document.getElementById('forgotEmail').value.trim();
            var captcha = document.getElementById('forgotCaptcha').value.trim();
            var btn = document.getElementById('submitBtn');
            
            showMessage('', '');
            
            if (!email) {
                showMessage('请输入邮箱', 'error');
                return false;
            }
            if (!captcha) {
                showMessage('请输入验证码', 'error');
                return false;
            }
            
            btn.disabled = true;
            btn.textContent = '发送中...';
            
            try {
                var res = await fetch(getApiBaseUrl() + '/api/password/forgot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: email,
                        captcha: captcha
                    })
                });
                var result = await res.json();
                
                if (result.success) {
                    showMessage('重置链接已生成！请点击下方链接前往重置密码', 'success');
                    
                    // 显示重置链接
                    if (result.resetUrl) {
                        var linkBox = document.getElementById('resetLinkBox');
                        var linkUrl = document.getElementById('resetLinkUrl');
                        linkUrl.href = result.resetUrl;
                        linkUrl.textContent = result.resetUrl;
                        linkBox.classList.add('show');
                    } else {
                        // 邮箱不存在，仍显示成功提示但不显示链接
                        showMessage(result.message || '如果该邮箱已注册，重置链接将发送到邮箱（开发模式：请检查控制台日志）', 'info');
                    }
                    
                    // 只清空验证码，保留邮箱
                    document.getElementById('forgotCaptcha').value = '';
                    refreshCaptcha();
                } else {
                    showMessage('❌ ' + (result.message || '发送失败，请重试'), 'error');
                    // 只清空验证码，保留邮箱
                    document.getElementById('forgotCaptcha').value = '';
                    refreshCaptcha();
                }
            } catch (e) {
                showMessage('网络错误，请稍后重试', 'error');
                refreshCaptcha();
            } finally {
                btn.disabled = false;
                btn.textContent = '发送重置链接';
            }
        }
        
        // 初始化
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            handleForgotPassword();
        });
        refreshCaptcha();
    </script>
</body>
</html>
