<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AlgoViz</title>
    <link rel="icon" type="image/png" href="../images/tubiao.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.lamp-off {
            background: #0a0a18;
            background-image:
                radial-gradient(ellipse at 20% 80%, rgba(30, 30, 70, 0.5) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(15, 15, 50, 0.4) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a18 0%, #050510 100%);
        }

        body.lamp-off::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 8% 15%, rgba(255, 255, 255, 0.35) 50%, transparent 50%),
                radial-gradient(1px 1px at 15% 45%, rgba(255, 255, 255, 0.2) 50%, transparent 50%),
                radial-gradient(1px 1px at 25% 75%, rgba(255, 255, 255, 0.3) 50%, transparent 50%),
                radial-gradient(2px 2px at 45% 8%, rgba(255, 255, 255, 0.12) 50%, transparent 50%),
                radial-gradient(1px 1px at 65% 80%, rgba(255, 255, 255, 0.25) 50%, transparent 50%),
                radial-gradient(1px 1px at 85% 30%, rgba(255, 255, 255, 0.18) 50%, transparent 50%),
                radial-gradient(1px 1px at 92% 65%, rgba(255, 255, 255, 0.22) 50%, transparent 50%),
                radial-gradient(1px 1px at 55% 55%, rgba(255, 255, 255, 0.1) 50%, transparent 50%),
                radial-gradient(1px 1px at 38% 92%, rgba(255, 255, 255, 0.28) 50%, transparent 50%),
                radial-gradient(1px 1px at 72% 12%, rgba(255, 255, 255, 0.15) 50%, transparent 50%);
            opacity: 0.6;
            pointer-events: none;
            animation: twinkle 5s ease-in-out infinite alternate;
        }

        @keyframes twinkle { 0% { opacity: 0.25; } 100% { opacity: 0.7; } }

        body.lamp-on {
            background: #f5f7fa;
            background-image:
                radial-gradient(ellipse at 20% 80%, rgba(255, 235, 190, 0.6) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(200, 220, 255, 0.4) 0%, transparent 50%),
                linear-gradient(180deg, #fcfcfe 0%, #e4e8ef 100%);
        }

        body.lamp-on::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 16.67% 55%, rgba(255, 220, 140, 0.3) 0%, transparent 45%);
            pointer-events: none;
        }

        /* ============ 台灯 ============ */
        .lamp-container {
            position: fixed;
            left: 8%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            cursor: default;
            user-select: none;
        }

        .lamp-svg {
            width: 260px;
            height: 480px;
            overflow: visible;
        }

        .lamp-glow {
            position: absolute;
            left: 50%;
            top: 50px;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
            background: radial-gradient(
                circle,
                rgba(255, 230, 150, 0.7) 0%,
                rgba(255, 220, 130, 0.45) 12%,
                rgba(255, 200, 100, 0.25) 28%,
                rgba(255, 180, 80, 0.1) 45%,
                transparent 65%
            );
        }
        body.lamp-on .lamp-glow { opacity: 1; }

        /* 灯罩 */
        .lamp-shade-outer { transition: fill 1s ease, stroke 1s ease; }
        body.lamp-off .lamp-shade-outer { fill: #3a3a4e; stroke: #2a2a3a; }
        body.lamp-on .lamp-shade-outer { fill: #8a7a5a; stroke: #6a5a3a; }

        .lamp-shade-inner { transition: fill 1s ease; }
        body.lamp-off .lamp-shade-inner { fill: #1e1e2e; }
        body.lamp-on .lamp-shade-inner { fill: #fff4d6; }

        .lamp-shade-ring { transition: fill 1s ease; }
        body.lamp-off .lamp-shade-ring { fill: #2a2a3a; }
        body.lamp-on .lamp-shade-ring { fill: #c9a959; }

        .lamp-bulb { transition: all 0.8s ease; }
        body.lamp-off .lamp-bulb { fill: #2a2a3a; opacity: 0.4; }
        body.lamp-on .lamp-bulb {
            fill: #fff8dc;
            opacity: 1;
            filter: drop-shadow(0 0 20px rgba(255, 220, 100, 1));
        }

        .lamp-filament { transition: stroke 0.8s ease, filter 0.8s ease; }
        body.lamp-off .lamp-filament { stroke: #4a4a5a; }
        body.lamp-on .lamp-filament {
            stroke: #ffd966;
            filter: drop-shadow(0 0 6px rgba(255, 200, 80, 0.8));
        }

        .lamp-stand { transition: fill 1s ease; }
        body.lamp-off .lamp-stand { fill: #3a3a4a; }
        body.lamp-on .lamp-stand { fill: #5a4a3a; }

        .lamp-base { transition: fill 1s ease; }
        body.lamp-off .lamp-base { fill: #2a2a3a; }
        body.lamp-on .lamp-base { fill: #4a3a2a; }

        /* 拉绳 */
        .pull-cord-group { cursor: pointer; }
        .pull-cord { transition: stroke 1s ease; }
        body.lamp-off .pull-cord { stroke: #5a5a6a; }
        body.lamp-on .pull-cord { stroke: #8a7a5a; }

        .pull-ball { transition: all 1s ease; }
        body.lamp-off .pull-ball { fill: #6a5a4a; }
        body.lamp-on .pull-ball {
            fill: #d4a843;
            filter: drop-shadow(0 0 8px rgba(255, 200, 100, 0.8));
        }

        .pull-cord-group:hover .pull-ball {
            filter: brightness(1.3) drop-shadow(0 0 10px rgba(255, 200, 100, 0.7)) !important;
        }

        .lamp-container.pulling .pull-cord-group {
            animation: pullCord 0.45s ease-in-out 2;
            transform-origin: 160px 165px;
        }

        @keyframes pullCord {
            0%   { transform: rotate(0deg) translateY(0); }
            25%  { transform: rotate(10deg) translateY(6px); }
            50%  { transform: rotate(-4deg) translateY(14px); }
            75%  { transform: rotate(6deg) translateY(8px); }
            100% { transform: rotate(0deg) translateY(0); }
        }

        .lamp-container.pulling .pull-ball {
            animation: pullBall 0.45s ease-in-out 2;
        }
        @keyframes pullBall {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(14px); }
        }

        /* ============ 登录表单 ============ */
        .login-container {
            position: fixed;
            left: 66.67vw;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 460px;
            padding: 44px 40px 30px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: all 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
        }

        body.lamp-on .login-container {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow:
                0 8px 40px rgba(100, 120, 180, 0.15),
                0 2px 15px rgba(255, 220, 150, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-desc {
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
            transition: color 0.8s ease;
        }
        body.lamp-off .login-desc { color: rgba(255,255,255,0.4); }
        body.lamp-on .login-desc { color: #8899aa; }

        .login-tabs {
            display: flex;
            border-bottom: 2px solid;
            margin-bottom: 24px;
            transition: border-color 0.8s ease;
        }
        body.lamp-off .login-tabs { border-color: rgba(255,255,255,0.12); }
        body.lamp-on .login-tabs { border-color: #e0e6ed; }

        .login-tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s ease;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            font-size: 14px;
            color: inherit;
        }
        body.lamp-off .login-tab { color: rgba(255,255,255,0.45); }
        body.lamp-on .login-tab { color: #999; }
        .login-tab:hover { color: #667eea !important; }
        .login-tab.active { color: #667eea !important; border-bottom-color: #667eea; }

        .tab-section { display: none; }
        .tab-section.active { display: block; }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.8s ease;
        }
        body.lamp-off .form-group label { color: rgba(255,255,255,0.55); }
        body.lamp-on .form-group label { color: #556677; }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        body.lamp-off .form-input {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
            color: #fff;
        }
        body.lamp-off .form-input::placeholder { color: rgba(255,255,255,0.3); }
        body.lamp-on .form-input {
            background: rgba(255, 255, 255, 0.6);
            border-color: #dde4eb;
            color: #333;
        }
        body.lamp-on .form-input::placeholder { color: #aabbcc; }
        .form-input:focus {
            border-color: #667eea !important;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* 验证码行 */
        .captcha-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }
        .captcha-row .form-input { flex: 1; }

        .captcha-img {
            height: 44px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        body.lamp-off .captcha-img { border-color: rgba(255,255,255,0.15); }
        body.lamp-on .captcha-img { border-color: #dde4eb; }
        .captcha-img:hover { opacity: 0.85; }

        /* 发送验证码按钮 */
        .send-code-btn {
            padding: 0 16px;
            height: 44px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex-shrink: 0;
        }
        .send-code-btn:hover { box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
        .send-code-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .login-error { color: #e74c3c; font-size: 13px; margin-top: 8px; min-height: 18px; }

        .account-login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            letter-spacing: 3px;
        }
        .account-login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); }
        .account-login-btn:active { transform: translateY(0); }
        .account-login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid;
            transition: border-color 0.8s ease;
        }
        body.lamp-off .form-footer { border-color: rgba(255,255,255,0.1); }
        body.lamp-on .form-footer { border-color: #e8ecf1; }

        .form-footer .link-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 0;
        }
        .form-footer .link-btn:hover { color: #5a5fc0 !important; }
        body.lamp-off .form-footer .link-btn { color: rgba(255,255,255,0.55); }
        body.lamp-on .form-footer .link-btn { color: #667eea; }

        /* 微信扫码 */
        .qrcode-section { margin-bottom: 16px; text-align: center; }
        .qrcode {
            width: 180px; height: 180px;
            background: white; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center; padding: 10px;
        }
        .qrcode img { width: 100%; height: 100%; object-fit: contain; }

        .verification-code {
            font-family: 'Fira Code', monospace;
            font-size: 22px; font-weight: 600; letter-spacing: 6px;
            margin-bottom: 6px; color: #667eea; text-align: center;
        }
        .countdown { font-size: 13px; text-align: center; transition: color 0.8s ease; }
        body.lamp-off .countdown { color: rgba(255,255,255,0.4); }
        body.lamp-on .countdown { color: #8899aa; }

        .login-footer { display: flex; gap: 10px; margin-top: 16px; }
        .refresh-btn, .confirm-btn {
            flex: 1; padding: 11px; border-radius: 10px;
            font-weight: 500; cursor: pointer; transition: all 0.3s ease; font-size: 14px; border: none;
        }
        .refresh-btn { background: rgba(255,255,255,0.1); color: inherit; border: 1px solid rgba(255,255,255,0.2); }
        body.lamp-on .refresh-btn { background: #f5f7fa; border: 1px solid #dde4eb; color: #556677; }
        .refresh-btn:hover { border-color: #667eea; color: #667eea; }
        .confirm-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .confirm-btn:hover { box-shadow: 0 4px 15px rgba(102,126,234,0.4); }

        /* 提示文字 */
        .hint-text {
            position: fixed;
            left: 8%;
            top: calc(50% + 260px);
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            z-index: 10;
            animation: pulse 3s ease-in-out infinite;
        }
        body.lamp-on .hint-text { opacity: 0; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }

        /* ============ 响应式 ============ */
        @media (max-width: 900px) {
            .lamp-container { left: 3%; }
            .lamp-svg { width: 180px; height: 360px; }
            .login-container { left: 50vw; width: 90%; max-width: 400px; padding: 30px 24px 24px; }
            .hint-text { left: 3%; top: calc(50% + 200px); }
        }
    </style>
</head>
<body class="lamp-off">

    <!-- 台灯 -->
    <div class="lamp-container" id="lampContainer">
        <div class="lamp-glow"></div>
        <svg class="lamp-svg" viewBox="0 0 260 480">
            <!-- 底座阴影 -->
            <ellipse cx="130" cy="455" rx="70" ry="10" fill="rgba(0,0,0,0.3)"/>
            <!-- 底座 -->
            <ellipse class="lamp-base" cx="130" cy="445" rx="65" ry="16"/>
            <ellipse class="lamp-base" cx="130" cy="440" rx="58" ry="12" style="opacity:0.7"/>
            <!-- 灯杆 -->
            <rect class="lamp-stand" x="123" y="200" width="14" height="245" rx="5"/>
            <rect class="lamp-stand" x="125" y="200" width="4" height="245" rx="2" style="opacity:0.3"/>
            <!-- 灯杆支架 -->
            <path class="lamp-stand" d="M120,200 Q120,190 130,190 Q140,190 140,200"/>
            <!-- 灯罩外圈 -->
            <path class="lamp-shade-outer" d="M40,95 Q40,55 75,40 L185,40 Q220,55 220,95 L200,200 L60,200 Z"/>
            <!-- 灯罩内圈 -->
            <path class="lamp-shade-inner" d="M55,95 L75,195 L185,195 L205,95 Q205,70 180,52 L80,52 Q55,70 55,95 Z"/>
            <!-- 灯罩底部金属圈 -->
            <ellipse class="lamp-shade-ring" cx="130" cy="197" rx="75" ry="8"/>
            <ellipse class="lamp-shade-ring" cx="130" cy="197" rx="72" ry="5" style="fill:none; opacity:0.5"/>
            <!-- 灯罩顶部装饰 -->
            <path class="lamp-shade-ring" d="M75,40 L185,40" style="stroke-width:3"/>
            <!-- 灯泡 -->
            <ellipse class="lamp-bulb" cx="130" cy="210" rx="22" ry="28"/>
            <!-- 灯丝 -->
            <path class="lamp-filament" d="M118,200 Q120,230 125,210 Q130,190 135,210 Q140,230 142,200" stroke-width="2" fill="none"/>
            <!-- 拉绳组 -->
            <g class="pull-cord-group" id="pullCord">
                <path class="pull-cord" d="M160,160 Q165,185 162,210" stroke-width="2" fill="none"/>
                <circle class="pull-ball" cx="162" cy="215" r="10"/>
                <circle class="pull-ball" cx="162" cy="215" r="10" style="fill:none; stroke: rgba(255,255,255,0.3); stroke-width:1.5"/>
            </g>
        </svg>
        <div class="hint-text">💡 点击拉绳开灯</div>
    </div>

    <!-- 登录表单 -->
    <div class="login-container" id="loginContainer">
        <h1 class="login-title">登录 AlgoViz</h1>
        <p class="login-desc">选择登录方式</p>

        <div class="login-tabs">
            <button class="login-tab active" id="tabAccount" onclick="switchTab('account')">账号登录</button>
            <button class="login-tab" id="tabEmail" onclick="switchTab('email')">邮箱登录</button>
            <button class="login-tab" id="tabWechat" onclick="switchTab('wechat')">微信登录</button>
        </div>

        <!-- 账号密码登录 -->
        <div class="tab-section active" id="accountSection">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" class="form-input" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" class="form-input" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div class="captcha-row">
                    <input type="text" id="accountCaptcha" class="form-input" placeholder="请输入验证码" maxlength="4" autocomplete="off">
                    <img id="accountCaptchaImg" class="captcha-img" src="" alt="验证码" onclick="refreshCaptcha('account')" title="点击刷新">
                </div>
            </div>
            <div class="login-error" id="accountError"></div>
            <button class="account-login-btn" onclick="doAccountLogin()">登 录</button>
        </div>

        <!-- 邮箱验证码登录 -->
        <div class="tab-section" id="emailSection">
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="loginEmail" class="form-input" placeholder="请输入邮箱" autocomplete="email">
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div class="captcha-row">
                    <input type="text" id="emailCaptcha" class="form-input" placeholder="请输入验证码" maxlength="4" autocomplete="off">
                    <img id="emailCaptchaImg" class="captcha-img" src="" alt="验证码" onclick="refreshCaptcha('email')" title="点击刷新">
                </div>
            </div>
            <div class="form-group">
                <label>邮箱验证码</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="emailCode" class="form-input" placeholder="请输入邮箱验证码" maxlength="6" autocomplete="off" style="flex:1;">
                    <button type="button" id="sendCodeBtn" class="send-code-btn" onclick="sendEmailCode()">获取验证码</button>
                </div>
                <div id="sendCodeTip" style="font-size:12px; margin-top:4px; display:none;"></div>
            </div>
            <div class="login-error" id="emailError"></div>
            <button class="account-login-btn" onclick="doEmailLogin()">登 录</button>
        </div>

        <!-- 微信扫码登录 -->
        <div class="tab-section" id="wechatSection">
            <div class="qrcode-section">
                <div class="qrcode">
                    <img src="../images/erwaima.jpg" alt="微信二维码" onerror="this.src='https://via.placeholder.com/240?text=二维码'">
                </div>
            </div>
            <div class="verification-code" id="verifyCode">加载中...</div>
            <div class="countdown"><span id="countdown">--</span> 秒后过期</div>
            <input id="manualCodeInput" type="text" inputmode="numeric" maxlength="6" placeholder="手动输入6位验证码（可选）" class="form-input" style="margin-top:12px;">
            <div class="login-footer">
                <button class="refresh-btn" onclick="refreshCode()">刷新</button>
                <button class="confirm-btn" onclick="doLogin()">确认登录</button>
            </div>
        </div>

        <!-- 底部链接 -->
        <div class="form-footer">
            <button class="link-btn" onclick="switchTab('account');">忘记密码？</button>
            <button class="link-btn" onclick="goRegister()">立即注册 →</button>
        </div>
    </div>

    <script>
    (function() {
        function getApiBaseUrl() {
            var protocol = window.location.protocol;
            var host = window.location.hostname || 'dsaol.asia';
            if (protocol === 'https:') return 'https://' + host + ':3000';
            return 'http://' + host + ':80';
        }
        var API_BASE_URL = getApiBaseUrl();
        var pollInterval = null;
        var wechatInitialized = false;

        // ============ 台灯控制 ============
        var body = document.body;
        var lampContainer = document.getElementById('lampContainer');
        var pullCord = document.getElementById('pullCord');
        var isLampOn = false;

        function toggleLamp() {
            isLampOn = !isLampOn;
            lampContainer.classList.add('pulling');
            setTimeout(function() { lampContainer.classList.remove('pulling'); }, 900);

            if (isLampOn) {
                body.classList.remove('lamp-off');
                body.classList.add('lamp-on');
                setTimeout(function() {
                    refreshCaptcha('account');
                    refreshCaptcha('email');
                    if (!wechatInitialized) {
                        wechatInitialized = true;
                        fetchVerificationCode();
                    }
                }, 600);
            } else {
                body.classList.remove('lamp-on');
                body.classList.add('lamp-off');
                if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
                if (window.countdownInterval) { clearInterval(window.countdownInterval); }
            }
        }

        pullCord.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleLamp();
        });

        // ============ 验证码 ============
        function refreshCaptcha(type) {
            fetch(API_BASE_URL + '/api/captcha/generate', {
                method: 'GET', credentials: 'include'
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    var imgId = type === 'email' ? 'emailCaptchaImg' : 'accountCaptchaImg';
                    document.getElementById(imgId).src = data.image;
                }
            })
            .catch(function(err) { console.error('获取验证码失败:', err); });
        }

        // ============ Tab 切换 ============
        function switchTab(tab) {
            var tabs = document.querySelectorAll('.login-tab');
            var sections = document.querySelectorAll('.tab-section');
            tabs.forEach(function(t) { t.classList.remove('active'); });
            sections.forEach(function(s) { s.classList.remove('active'); });

            if (tab === 'account') {
                document.getElementById('tabAccount').classList.add('active');
                document.getElementById('accountSection').classList.add('active');
                refreshCaptcha('account');
            } else if (tab === 'email') {
                document.getElementById('tabEmail').classList.add('active');
                document.getElementById('emailSection').classList.add('active');
                refreshCaptcha('email');
            } else {
                document.getElementById('tabWechat').classList.add('active');
                document.getElementById('wechatSection').classList.add('active');
                if (!wechatInitialized) {
                    wechatInitialized = true;
                    fetchVerificationCode();
                }
            }

            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
            if (window.countdownInterval) { clearInterval(window.countdownInterval); }
        }

        // ============ 账号登录 ============
        async function doAccountLogin() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            var captcha = document.getElementById('accountCaptcha').value.trim();
            var errorEl = document.getElementById('accountError');
            errorEl.textContent = '';

            if (!username) { errorEl.textContent = '请输入用户名'; return; }
            if (!password) { errorEl.textContent = '请输入密码'; return; }
            if (!captcha) { errorEl.textContent = '请输入验证码'; return; }

            var btn = document.querySelector('#accountSection .account-login-btn');
            var originalText = btn.textContent;
            btn.textContent = '登录中...';
            btn.disabled = true;

            try {
                var res = await fetch(API_BASE_URL + '/api/login/account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: username, password: password, captcha: captcha })
                });
                var result = await res.json();
                if (result.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userAvatar', '👤');
                    localStorage.setItem('userInfo', JSON.stringify(result.userInfo || {}));
                    localStorage.setItem('token', result.token || '');
                    window.location.href = 'profile.html';
                } else {
                    errorEl.textContent = result.message || '登录失败';
                    refreshCaptcha('account');
                }
            } catch (e) {
                errorEl.textContent = '网络错误，请稍后重试';
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // ============ 邮箱验证码发送 ============
        var sendCodeCountdown = null;
        var emailRegex = /^[\w.-]+@[\w.-]+\.\w+$/;
        async function sendEmailCode() {
            var emailInput = document.getElementById('loginEmail');
            var email = emailInput ? (emailInput.value || '').trim() : '';
            var captchaInput = document.getElementById('emailCaptcha');
            var captcha = captchaInput ? (captchaInput.value || '').trim() : '';
            var errorEl = document.getElementById('emailError');
            var tipEl = document.getElementById('sendCodeTip');
            var btn = document.getElementById('sendCodeBtn');
            
            errorEl.textContent = '';
            tipEl.style.display = 'none';

            if (!email) { errorEl.textContent = '请输入邮箱'; return; }
            if (!emailRegex.test(String(email))) { errorEl.textContent = '邮箱格式不正确'; return; }
            if (!captcha) { errorEl.textContent = '请先输入验证码'; return; }

            btn.disabled = true;
            btn.textContent = '发送中...';

            try {
                var res = await fetch(API_BASE_URL + '/api/login/send-email-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email: email, captcha: captcha })
                });
                var result = await res.json();
                if (result.success) {
                    tipEl.style.display = 'block';
                    tipEl.style.color = '#27ae60';
                    tipEl.textContent = '验证码已发送，请查收邮件';
                    startCountdown(60);
                    refreshCaptcha('email');
                    document.getElementById('emailCaptcha').value = '';
                } else {
                    errorEl.textContent = result.message || '发送失败';
                    refreshCaptcha('email');
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                }
            } catch (e) {
                errorEl.textContent = '网络错误，请稍后重试';
                btn.disabled = false;
                btn.textContent = '获取验证码';
            }
        }

        function startCountdown(seconds) {
            var btn = document.getElementById('sendCodeBtn');
            var remaining = seconds;
            btn.disabled = true;
            btn.textContent = remaining + 's';
            if (sendCodeCountdown) clearInterval(sendCodeCountdown);
            sendCodeCountdown = setInterval(function() {
                remaining--;
                btn.textContent = remaining + 's';
                if (remaining <= 0) {
                    clearInterval(sendCodeCountdown);
                    sendCodeCountdown = null;
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                }
            }, 1000);
        }

        // ============ 邮箱验证码登录 ============
        async function doEmailLogin() {
            var email = document.getElementById('loginEmail').value.trim();
            var code = document.getElementById('emailCode').value.trim();
            var errorEl = document.getElementById('emailError');
            errorEl.textContent = '';

            if (!email) { errorEl.textContent = '请输入邮箱'; return; }
            if (!code) { errorEl.textContent = '请输入邮箱验证码'; return; }

            var btn = document.querySelector('#emailSection .account-login-btn');
            var originalText = btn.textContent;
            btn.textContent = '登录中...';
            btn.disabled = true;

            try {
                var res = await fetch(API_BASE_URL + '/api/login/email-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email: email, code: code })
                });
                var result = await res.json();
                if (result.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userAvatar', '👤');
                    localStorage.setItem('userInfo', JSON.stringify(result.userInfo || {}));
                    localStorage.setItem('token', result.token || '');
                    window.location.href = 'profile.html';
                } else {
                    errorEl.textContent = result.message || '登录失败';
                }
            } catch (e) {
                errorEl.textContent = '网络错误，请稍后重试';
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // ============ 微信登录 ============
        function startWechatCountdown(seconds) {
            var el = document.getElementById('countdown');
            if (!el) return;
            var remaining = seconds || 120;
            el.textContent = remaining;
            if (window.countdownInterval) clearInterval(window.countdownInterval);
            window.countdownInterval = setInterval(function() {
                remaining--;
                el.textContent = remaining;
                if (remaining <= 0) {
                    clearInterval(window.countdownInterval);
                    if (pollInterval) clearInterval(pollInterval);
                    var codeEl = document.getElementById('verifyCode');
                    if (codeEl) codeEl.textContent = '已过期';
                }
            }, 1000);
        }

        async function fetchVerificationCode() {
            var codeEl = document.getElementById('verifyCode');
            if (codeEl) codeEl.textContent = '获取中...';
            try {
                var res = await fetch(API_BASE_URL + '/api/login/verification-code', {
                    method: 'GET', credentials: 'include'
                });
                if (res.ok) {
                    var data = await res.text();
                    if (codeEl) codeEl.textContent = data;
                    startWechatCountdown(120);
                    startPolling(data);
                    return data;
                }
                if (codeEl) codeEl.textContent = '获取失败';
            } catch (error) {
                if (codeEl) codeEl.textContent = '网络错误';
            }
        }

        function startPolling(code) {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async function() {
                try {
                    var res = await fetch(API_BASE_URL + '/api/login/check-status?code=' + encodeURIComponent(code), { credentials: 'include' });
                    var result = await res.json();
                    if (result.success === true) {
                        clearInterval(pollInterval);
                        if (window.countdownInterval) clearInterval(window.countdownInterval);
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('userAvatar', '👤');
                        localStorage.setItem('userInfo', JSON.stringify(result.userInfo || {}));
                        localStorage.setItem('token', result.token || '');
                        window.location.href = 'profile.html';
                    } else if (result.message === '验证码无效或已过期') {
                        clearInterval(pollInterval);
                        var codeEl = document.getElementById('verifyCode');
                        if (codeEl) codeEl.textContent = '已过期';
                    }
                } catch (e) { console.error(e); }
            }, 2000);
        }

        function refreshCode() { fetchVerificationCode(); }

        async function doLogin() {
            var manual = (document.getElementById('manualCodeInput').value || '').trim();
            var auto = (document.getElementById('verifyCode').textContent || '').trim();
            var code = manual || auto;
            if (!code.match(/^\d{6}$/)) { alert('验证码有误请重新填写'); return; }
            try {
                var res = await fetch(API_BASE_URL + '/api/login/check-status?code=' + encodeURIComponent(code), { credentials: 'include' });
                var result = await res.json();
                if (result.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userAvatar', '👤');
                    localStorage.setItem('userInfo', JSON.stringify(result.userInfo));
                    localStorage.setItem('token', result.token);
                    window.location.href = 'profile.html';
                    return;
                }
                alert(result.message || '等待扫码');
            } catch (e) { alert('网络错误'); }
        }

        // ============ 跳转注册 ============
        function goRegister() {
            window.location.href = 'register.html';
        }

        // ============ 回车登录 ============
        document.getElementById('loginPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doAccountLogin();
        });
        document.getElementById('loginUsername').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doAccountLogin();
        });
        document.getElementById('loginEmail').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doEmailLogin();
        });
        document.getElementById('accountCaptcha').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doAccountLogin();
        });
        document.getElementById('emailCaptcha').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendEmailCode();
        });
        document.getElementById('emailCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doEmailLogin();
        });

        window.switchTab = switchTab;
        window.doAccountLogin = doAccountLogin;
        window.doEmailLogin = doEmailLogin;
        window.sendEmailCode = sendEmailCode;
        window.refreshCaptcha = refreshCaptcha;
        window.refreshCode = refreshCode;
        window.doLogin = doLogin;
        window.goRegister = goRegister;

    })();
    </script>
</body>
</html>
