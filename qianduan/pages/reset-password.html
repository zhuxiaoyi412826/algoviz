<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - AlgoVize</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
        }
        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            outline: none;
        }
        .form-input:focus {
            border-color: #667eea;
        }
        .password-strength {
            margin-top: 8px;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s, background-color 0.3s;
        }
        .password-strength-text {
            margin-top: 4px;
            font-size: 0.8rem;
            color: #888;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }
        .password-tips {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #666;
        }
        .password-tips strong {
            color: #555;
        }
        .password-tips ul {
            margin-top: 8px;
            padding-left: 20px;
        }
        .password-tips li {
            margin-bottom: 4px;
        }
        .error-page, .success-page {
            text-align: center;
        }
        .error-icon, .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .page-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 8px;
        }
        .page-desc {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="resetForm">
            <div class="header">
                <div class="logo">🔐</div>
                <h1>重置密码</h1>
                <p class="subtitle">请输入您的新密码</p>
            </div>
            
            <div id="message" class="message"></div>
            
            <form id="resetPasswordForm" onsubmit="return handleResetPassword()">
                <input type="hidden" id="resetToken" value="">
                
                <div class="form-group">
                    <label class="form-label">新密码</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="请输入新密码" required oninput="checkPasswordStrength(this.value)">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar" style="width: 0%; background-color: #e0e0e0;"></div>
                    </div>
                    <div class="password-strength-text" id="strengthText"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">确认新密码</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="请再次输入新密码" required>
                </div>
                
                <button type="submit" id="submitBtn" class="submit-btn">确认重置</button>
            </form>
            
            <div class="password-tips">
                <strong>🔒 密码要求</strong>
                <ul>
                    <li>长度 6-32 位</li>
                    <li>包含大小写字母</li>
                    <li>包含至少一个数字</li>
                    <li>包含至少一个特殊字符（如 !@#$%）</li>
                </ul>
            </div>
        </div>
        
        <!-- 成功页面 -->
        <div class="card" id="successPage" style="display: none;">
            <div class="error-page">
                <div class="success-icon">🎉</div>
                <h2 class="page-title">密码重置成功</h2>
                <p class="page-desc">您的密码已成功重置，请使用新密码登录</p>
                <a href="login.html" class="submit-btn" style="display: inline-block; text-decoration: none; width: auto; padding: 12px 32px;">前往登录</a>
            </div>
        </div>
    </div>

    <script>
        // 获取API基础URL
        function getApiBaseUrl() {
            var protocol = window.location.protocol;
            var host = window.location.hostname || 'localhost';
            if (protocol === 'https:') {
                return 'https://' + host + ':3000';
            } else {
                return 'http://' + host + ':80';
            }
        }
        
        // 显示消息
        function showMessage(text, type) {
            var msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }
        
        // 检查密码强度
        function checkPasswordStrength(password) {
            var score = 0;
            if (password.length >= 6) score++;
            if (password.length >= 12) score++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)) score++;
            
            var bar = document.getElementById('strengthBar');
            var text = document.getElementById('strengthText');
            
            var width = (score / 5) * 100;
            var color = '#e74c3c';
            var label = '弱';
            
            if (score >= 2) { color = '#f39c12'; label = '中等'; }
            if (score >= 4) { color = '#27ae60'; label = '强'; }
            if (score >= 5) { color = '#2ecc71'; label = '非常强'; }
            
            bar.style.width = width + '%';
            bar.style.backgroundColor = color;
            text.textContent = '密码强度: ' + label;
            text.style.color = color;
        }
        
        // 处理重置密码提交
        async function handleResetPassword() {
            var token = document.getElementById('resetToken').value;
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var btn = document.getElementById('submitBtn');
            
            showMessage('', '');
            
            if (!token) {
                showMessage('无效的重置链接', 'error');
                return false;
            }
            if (!newPassword) {
                showMessage('请输入新密码', 'error');
                return false;
            }
            if (!confirmPassword) {
                showMessage('请确认新密码', 'error');
                return false;
            }
            if (newPassword !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return false;
            }
            
            btn.disabled = true;
            btn.textContent = '重置中...';
            
            try {
                var res = await fetch(getApiBaseUrl() + '/api/password/do-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });
                var result = await res.json();
                
                if (result.success) {
                    // 显示成功页面
                    document.getElementById('resetForm').style.display = 'none';
                    document.getElementById('successPage').style.display = 'block';
                } else {
                    showMessage(result.message || '重置失败，请重试', 'error');
                    btn.disabled = false;
                    btn.textContent = '确认重置';
                }
            } catch (e) {
                showMessage('网络错误，请稍后重试', 'error');
                btn.disabled = false;
                btn.textContent = '确认重置';
            }
            
            return false;
        }
        
        // 初始化：从URL获取token
        function init() {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');
            
            if (!token) {
                // 显示错误页面
                document.querySelector('.card').innerHTML = 
                    '<div class="error-page">' +
                        '<div class="error-icon">❌</div>' +
                        '<h2 class="page-title">无效的重置链接</h2>' +
                        '<p class="page-desc">您访问的链接可能已失效或不正确</p>' +
                        '<a href="forgot-password.html" class="submit-btn" style="display: inline-block; text-decoration: none; width: auto; padding: 12px 32px;">重新获取链接</a>' +
                    '</div>';
            } else {
                document.getElementById('resetToken').value = token;
            }
        }
        
        init();
    </script>
</body>
</html>
