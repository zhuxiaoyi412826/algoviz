        .visit-counter {
            margin-right: 1rem;
            padding: 0.5rem 1rem;
            background: var(--hover-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .video-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 1.5rem 0 0.5rem;
            color: var(--text-primary);
        }

        .video-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .video-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-secondary {
            padding: 0.75rem 1.5rem;
        }
    </style>
</head>

                    <div class="theme-switch-handle">
                        <span class="theme-icon">☀️</span>
                    </div>
                </button>

                    <span class="nav-avatar" id="navAvatar">👤</span>
                </a>
            </div>
        </div>

    <script>
    (function() {
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('algoviz-theme', theme);
            var btn = document.getElementById('themeToggle');
            if (btn) {
                var icon = btn.querySelector('.theme-icon');
                if (icon) {
                    icon.textContent = theme === 'dark' ? '🌙' : '☀️';
                }
            }
            document.body.style.background = theme === 'dark' ? '#0f0f23' : '#f5f7fa';
        }
        
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme') || 'light';
            var next = current === 'dark' ? 'light' : 'dark';
            setTheme(next);
        }
        
        function updateVisitCount() {
            var count = localStorage.getItem('visitCount') || 0;
            var hasVisited = localStorage.getItem('hasVisitedUnique');
            if (!hasVisited) {
                count = parseInt(count) + 1;
                localStorage.setItem('visitCount', count);
                localStorage.setItem('hasVisitedUnique', 'true');
            }
            
            var visitCountElement = document.getElementById('visitCount');
            if (visitCountElement) {
                visitCountElement.textContent = count;
            }
        }
        
        function checkLoginStatus() {
            var isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            var navAvatar = document.getElementById('navAvatar');
            var profileLink = document.getElementById('profileLink');
            
            if (isLoggedIn) {
                var userAvatar = localStorage.getItem('userAvatar') || '👤';
                navAvatar.textContent = userAvatar;
                profileLink.href = 'profile.html';
            } else {
                navAvatar.textContent = '👨';
                profileLink.href = 'login.html';
            }
        }
        
        window.toggleTheme = toggleTheme;
        
        var saved = localStorage.getItem('algoviz-theme') || 'light';
        setTheme(saved);
        
        var btn = document.getElementById('themeToggle');
        if (btn) {
            btn.addEventListener('click', toggleTheme);
        }
        
        checkLoginStatus();
        updateVisitCount();
    })();
    </script>
